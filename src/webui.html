      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--color-text);
        font: var(--text-base)/var(--leading-normal) var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: transparent;
        border: none;
      }
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-line-strong);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-accent-bd);
      }
      @keyframes bubble-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* ==== 连接 splash(kimi GlobalLoading) ==== */
      .gload {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        transition: opacity 0.3s;
      }
      .gload.hide {
        opacity: 0;
        pointer-events: none;
      }
      .gload-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .gload-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .gload-logo {
        width: 34px;
        height: 25px;
        color: var(--logo);
        animation: fadein 0.4s ease-out;
      }
      .gload-word,
      .auth-word {
        font-size: 26px;
        line-height: 32px;
        font-weight: 500;
        letter-spacing: -0.04em;
        color: var(--color-text);
      }
      .gload-text {
        font-size: 13px;
        color: var(--color-text-muted);
      }
      /* ==== 登录页(kimi auth-page) ==== */
      .auth-page {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        animation: fadein 0.3s ease-out;
      }
      .auth-page.show {
        display: flex;
      }
      .auth-page-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-width: 340px;
        text-align: center;
        padding: 24px;
      }
      .auth-page-logo {
        width: 34px;
        height: 25px;
        color: var(--logo);
      }
      .auth-page h1 {
        font-size: 19px;
        font-weight: var(--weight-semibold);
      }
      .auth-page p {
        font-size: 13px;
        color: var(--color-text-muted);
        line-height: 1.6;
      }
      .auth-page input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        color: var(--color-text);
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s;
      }
      .auth-page input:focus {
        border-color: var(--color-accent);
        box-shadow: 0 0 0 3px var(--color-accent-soft);
      }
      .auth-page button {
        width: 100%;
        height: 36px;
        border-radius: var(--radius-md);
        background: var(--color-accent);
        color: var(--color-text-on-accent);
        font-weight: var(--weight-medium);
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .auth-page button:hover {
        background: var(--color-accent-hover);
      }
      .auth-page button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .auth-err {
        font-size: 12px;
        color: var(--color-danger);
      }
      /* ==== 布局 ==== */
      .app {
        --side-w: 268px;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: var(--side-w) minmax(0, 1fr);
        background: var(--bg);
        color: var(--color-text);
        overflow: hidden;
        height: 100vh;
      }
      #side {
        border-right: 1px solid var(--color-line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .side-rail {
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding-top: 8px;
        border-right: 1px solid var(--color-line);
        background: var(--panel);
      }
      body.collapsed .app {
        grid-template-columns: 44px minmax(0, 1fr);
      }
      body.collapsed .side-rail {
        display: flex;
      }
      body.collapsed #side {
        display: none;
      }
      #main {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        position: relative;
      }
      /* ==== 侧栏 ==== */
      .ch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 56px;
        padding: 8px 12px;
        box-sizing: border-box;
      }
      .ch-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
        color: var(--logo);
        cursor: pointer;
      }
      .ch-logo {
        width: 24px;
        height: 18px;
        flex: none;
        color: inherit;
        transform-origin: 50% 60%;
      }
      .ch-name {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.04em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @keyframes logo-swim {
        0%,
        100% {
          transform: translate(0, 0) rotate(0);
        }
        35% {
          transform: translate(-1px, -1px) rotate(-5deg);
        }
        70% {
          transform: translate(1px, 0) rotate(3deg);
        }
      }
      @media (hover: hover) and (prefers-reduced-motion: no-preference) {
        .ch-brand:hover .ch-logo,
        .empty-headline:hover .empty-logo {
          animation: logo-swim 0.45s ease;
        }
      }
      .ch-ib {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-muted);
        flex: none;
      }
      .ch-ib:hover {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        margin: 0 10px 10px;
        padding: 0 12px;
        border-radius: 10px;
        color: var(--color-text-muted);
        background: var(--color-surface-sunken);
      }
      .search:hover {
        background: var(--color-surface-sunken);
      }
      .search-ic {
        flex: none;
        font-size: 12px;
        opacity: 0.8;
      }
      .search-t {
        font-size: 13px;
        color: var(--color-text-faint);
      }
      .btn-new-chat {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 38px;
        margin: 0 10px 10px;
        padding: 0 16px;
        border: 1px solid var(--color-line-strong);
        border-radius: 12px;
        background: var(--color-surface-raised);
        color: var(--color-text);
        font-size: 14px;
        font-weight: 500;
      }
      .btn-new-chat:hover {
        background: var(--color-surface);
      }
      .btn-add-proj {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
        margin: 4px 10px 8px;
        padding: 0 10px;
        border-radius: 8px;
        color: var(--color-text-muted);
        font-size: 13px;
      }
      .btn-add-proj:hover {
        background: var(--hover);
        color: var(--color-text);
      }
      .btn-new-chat .pl {
        color: var(--color-accent);
        font-size: 14px;
      }
      .sessions {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px 8px;
        min-height: 0;
      }
      .side-lab {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--color-text-faint);
        padding: 10px 8px 4px;
      }
      .sg-head {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 8px;
        margin: 0 4px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        user-select: none;
      }
      .sg-head.on {
        background: var(--color-surface-sunken);
      }
      .sg-chats {
        padding: 2px 0 8px 14px;
      }
      .sg-chev {
        font-size: 9px;
        color: var(--color-text-faint);
        transition: transform 0.15s;
        flex: none;
      }
      .sg-chev.open {
        transform: rotate(90deg);
      }
      .sg-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        font-weight: var(--weight-medium);
        color: var(--color-text-muted);
      }
      .sg-cnt {
        font-size: 11px;
        color: var(--color-text-faint);
      }
      .sg-ib {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-faint);
        font-size: 12px;
        opacity: 0;
      }
      .sg-head:hover .sg-ib,
      .sg-ib.open {
        opacity: 1;
      }
      .sg-ib:hover {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      .se {
        display: block;
        padding: 4px 8px;
        border-radius: var(--radius-md);
        cursor: pointer;
      }
      .se:hover {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      .se.on {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      .srow {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        min-height: 32px;
      }
      .lead {
        width: 16px;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .unread-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--color-text);
      }
      .spin {
        width: 12px;
        height: 12px;
        border: 2px solid var(--color-accent-bd);
        border-top-color: var(--color-accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .st {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        color: inherit;
      }
      .sts {
        font-size: 11px;
        color: var(--color-text-faint);
        flex: none;
        display: none;
      }
      .se:hover .sts {
        display: inline;
      }
      .tag {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: var(--radius-full);
        font-weight: var(--weight-medium);
        flex: none;
        display: none;
      }
      .se:hover .tag {
        display: inline;
      }
      .tag.warn {
        background: var(--color-warning-soft);
        color: var(--color-warning);
        border: 1px solid var(--color-warning-bd);
      }
      .tag.info {
        background: var(--color-accent-soft);
        color: var(--color-accent-hover);
        border: 1px solid var(--color-accent-bd);
      }
      .tag.danger {
        background: var(--color-danger-soft);

        color: var(--color-text);
      }
      .ib.open {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      /* ==== 聊天区 ==== */
      #stage {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: row;

      #col {

        min-height: 0;
        display: flex;

      #inspBd {

        overflow: auto;

      #inspBd pre {
        margin: 0;

      .insp-think {

      .insp-md {

        color: var(--color-text);
      }
      .insp-md h1,
      .insp-md h2,
      .insp-md h3 {
        line-height: 1.3;
        font-weight: 650;
        color: var(--color-text);
      }
      .insp-md h1 {
        font-size: 1.4em;
        margin: 0 0 0.65em;
      }
      .insp-md h2 {
        font-size: 1.18em;
        margin: 1.25em 0 0.45em;
      }
      .insp-md h3 {
        font-size: 1.05em;
        margin: 1.1em 0 0.35em;
      }
      .insp-md p {

      .insp-md pre {

        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        overflow-x: auto;
        font: 12.5px/1.6 var(--mono);
        margin: 0.7em 0 1em;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .insp-md code {
        font: 12.5px var(--mono);
        background: var(--color-surface);

        padding: 1px 5px;

        background: none;
        padding: 0;

      .insp-md a {

      .diff-view {
        font: 12.5px/1.55 var(--mono);

      .diff-file {

        color: var(--color-success);

        background: color-mix(in srgb, var(--color-danger) 14%, transparent);
      }
      .diff-row.del .g {
        color: var(--color-danger);
      }

        background: color-mix(in srgb, var(--color-accent) 10%, transparent);
        color: var(--color-text-faint);

      .todo-view {
        padding: 16px 20px 28px;
      }
      .todo-i {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 6px 0;
        font: 14px/1.5 var(--sans);

        height: 14px;
        margin-top: 3px;
        border: 1px solid var(--color-line-strong);

        background: var(--color-success);
        border-color: var(--color-success);
      }
      .todo-i.run .todo-box {
        border-color: var(--color-accent);
        box-shadow: inset 0 0 0 3px var(--color-accent);
      }
      .todo-i.done .todo-tx {
        color: var(--color-text-faint);
        text-decoration: line-through;
      }
      .todo-i.run .todo-tx {
        color: var(--color-text);
      }
      .todo-foot {
        margin-top: 10px;
        font: 12px/1.4 var(--sans);
        color: var(--color-text-faint);
      }
      .agent-view {
        padding: 16px 20px 28px;
      }
      .todo-bind {
        margin-left: 6px; font-size: 11px; color: var(--color-text-faint);
        font-family: var(--mono, ui-monospace, monospace);
      }
      .agent-desc {
        font: 14px/1.55 var(--sans);
        color: var(--color-text);
        margin-bottom: 12px;
      }
      .sub-log {
        margin: 8px 0 4px;
        padding: 4px 0 4px 2px;
      }
      .sub-i {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font: 12px/1.45 var(--sans);
        color: var(--color-text-faint);
        padding: 2px 0;
      }
      .sub-idx {
        flex: none;
        min-width: 1.2em;
        color: var(--color-text-muted);
        font-variant-numeric: tabular-nums;
      }
      .sub-k {
        flex: none;
        color: var(--color-text-muted);
      }
      .sub-i.tool_failed .sub-k {
        color: var(--color-danger);
      }
      .sub-i.finished .sub-k {
        color: var(--color-success);
      }
      .sub-t {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #inspBd .insp-wait {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font: 13px/1.5 var(--sans);
        color: var(--color-text-faint);
      }
      .tcall.watching .bh {
        box-shadow: inset 2px 0 0 var(--color-accent);
      }
      #app.hero #inspect {
        display: none !important;
      }
      @media (max-width: 900px) {
        #inspect:not([hidden]) {
          position: fixed;
          inset: 8px;
          z-index: var(--z-modal);
          width: auto;
          flex: none;
          margin: 0;
        }
      }
      #stage:has(#inspect:not([hidden])) #wrap {
        padding-right: 28px;
      }
      #stage:has(#inspect:not([hidden])) #cmp {
        padding-right: 24px;
      }
      #wrap {
        width: 100%;
        max-width: var(--p-content-max);
        min-height: 100%;
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        padding: 24px 20px 24px;
      }
      #wrap.mobile {
        max-width: none;
        padding: 14px 12px 24px;
      }
      #thread {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .hist-more {
        display: block;
        align-self: center;
        margin: 4px 0 4px;
        padding: 6px 14px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--dim);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        border-radius: 999px;
      }
      .hist-more:hover { color: var(--blue); border-color: var(--bd); }
      .hist-more[hidden] { display: none; }
      .find-hit { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
      .img-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .img-chip img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
      .img-chip button { border: 0; background: transparent; color: var(--muted); cursor: pointer; }
      .empty-spacer {
        flex: 1;
      }
      .empty-hint {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px 0 8px;
        text-align: center;
      }
      .ws-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: min(100%, 360px);
        min-height: 28px;
        padding: 0 10px;
        border-radius: 16px;
        color: var(--color-text);
        font-size: 13px;
        font-weight: 500;
      }
      .ws-chip:hover {
        background: var(--hover);
      }
      .ws-chip-ic,
      .ws-chip-chev {
        color: var(--color-text-muted);
        font-size: 12px;
      }
      .empty-headline {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--color-text);
      }
      .empty-logo {
        width: 34px;
        height: 25px;
        color: var(--color-text);
      }
      .empty-hint-title {
        font-size: 26px;
        line-height: 32px;
        font-weight: 500;
        letter-spacing: -0.04em;
      }
      .empty-hint-text {
        font-size: 14px;
        line-height: 1.55;
        color: var(--color-text-muted);
        max-width: 28em;
      }
      .ws-pick {
        margin-top: 12px;
      }
      .ws-pick-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        color: var(--color-text);
        font-size: 13px;
      }
      .ws-pick-btn:hover {
        border-color: var(--color-accent-bd);
      }
      .ws-pick-chev {
        font-size: 9px;
        color: var(--color-text-faint);
      }
      /* 气泡：用户一块浅底，助手直接铺在底上 */

        display: flex;
        align-items: flex-start;
        gap: 8px;
        max-width: 42em;
      }
      .u-bub {
        flex: 1;
        min-width: 0;
        background: var(--color-surface-sunken);
        color: var(--color-text);
        border-radius: 12px;
        padding: 8px 12px;
        font-size: var(--content-font-size);
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .u-img {
        display: block;

        margin-top: 6px;

        opacity: 1;

      .undo-chip,
      .copy-chip {
        flex: none;
        width: 22px;
        height: 22px;
        border: none;
        background: transparent;
        color: var(--color-text-faint);
        font-size: 13px;
        cursor: pointer;
      }
      .undo-chip:hover,
      .copy-chip:hover {
        color: var(--color-text);
      }

        gap: 6px;

        max-width: 46em;
        position: relative;
      }

        font-size: 12px;
        color: var(--color-text-faint);
      }

        position: absolute;
        top: 0;
        right: 0;

        gap: 2px;
        opacity: 0;
        transition: opacity 0.15s;

      .a-turn:hover .a-ops {
        opacity: 1;
      }
      .a-ops button {
        width: 22px;
        height: 22px;
        border: none;
        background: transparent;
        color: var(--color-text-faint);
        font-size: 13px;
        cursor: pointer;
      }
      .a-ops button:hover {
        color: var(--color-text);
      }
      .a-msg {
        width: 100%;
        font-size: var(--content-font-size);
        line-height: 1.55;
      }
      .a-msg .md {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .a-msg pre {
        background: var(--color-surface);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        overflow-x: auto;
        font: 12.5px/1.6 var(--mono);
        margin: 8px 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .a-msg code {
        font: 12.5px var(--mono);
        background: var(--color-surface);
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--color-accent);
      }
      .a-msg pre code {
        background: none;
        padding: 0;
        color: var(--color-text);
      }
      /* 思考：默认一行，点开才见全文 */
      .think {
        max-width: 46em;
      }
      .think-sum {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        color: var(--color-text-faint);
        font-size: 13px;
        padding: 2px 0;
        cursor: pointer;
      }
      .think-sum:hover {
        color: var(--color-text-muted);
      }
      .think-sum:focus {
        outline: none;
      }

        transform: rotate(90deg);
      }
      .think .tk {
        display: none;
        margin: 6px 0 0;
        font: 12.5px/1.55 var(--mono);
        color: var(--color-text-muted);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .think.open .tk {
        display: block;
      }
      /* 工具：收成摘要，点开才是明细 */

        max-width: 46em;
      }

        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        color: var(--color-text-faint);
        font: 13px/1.45 var(--mono);
        padding: 2px 0;
        cursor: pointer;
      }
      .work-sum:hover {
        color: var(--color-text-muted);

      .work-sum.edit {

      }
      .work.open .work-list,
      .work.live .work-list {
        display: block;
      }
      .flow {
        max-width: 46em;
        margin: 14px 0 18px;
      }
      .flow-hd {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 0 0 10px;
        cursor: pointer;
      }
      .flow-k {
        flex: none;
        font: 12px/1.4 var(--mono);
        color: var(--color-text-faint);
      }
      .flow-goal {

        min-width: 0;
        font: 14px/1.45 var(--sans);
        color: var(--color-text);

        cursor: pointer;

      .flow-n:last-child { padding-bottom: 0; }
      .flow-n:not(:last-child)::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 12px;
        bottom: -2px;
        width: 1px;
        background: color-mix(in srgb, var(--color-text) 12%, transparent);
      }
      .flow-dot {
        width: 9px;
        height: 9px;
        margin-top: 5px;
        border-radius: 50%;
        background: var(--color-text-faint);
        box-shadow: 0 0 0 3px var(--color-bg);
        position: relative;
        z-index: 1;
      }
      .flow-n.run .flow-dot {
        background: var(--color-accent, #6af);
        animation: flowPulse 1.1s ease-in-out infinite;
      }
      .flow-n.ok .flow-dot { background: var(--color-ok, #3a9); }
      .flow-n.fail .flow-dot { background: var(--color-danger, #c55); }
      .flow-n.skip .flow-dot { opacity: 0.35; }
      @keyframes flowPulse { 50% { opacity: 0.28; } }
      .flow-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font: 13px/1.45 var(--sans);
      }
      .flow-row b { font-weight: 600; font-family: var(--mono); }
      .flow-row em {
        font-style: normal;
        color: var(--color-text-faint);
        font-size: 12px;
      }
      .flow-act {
        margin-left: auto;
        font: 12px/1.4 var(--mono);
        color: var(--color-text-faint);
      }
      .flow-body {
        margin: 6px 0 0;
        max-height: 220px;
        overflow: auto;
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
        color: var(--color-text-muted);
      }
      .insp-bd .flow { margin: 0; }
      .tcall {
        margin: 2px 0;
        background: transparent;
        border: none;
        overflow: hidden;
      }
      .tcall.err .a,
      .tcall.err .p {
        color: var(--color-danger);
      }
      .tcall .bh {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 24px;
        padding: 1px 0;
        cursor: pointer;
        font: 12.5px/1.4 var(--mono);
        color: var(--color-text-muted);
      }
      .tcall.open .bh,
      .tcall .bh:hover {
        color: var(--color-text);
      }
      .tcall.err .bh {
        color: var(--color-danger);
      }
      .ico {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .work-bits {
        display: inline-flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }
      .work-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .work-dot {
        opacity: 0.45;
      }
      .tcall .gl {
        display: inline-flex;
        align-items: center;
        color: var(--color-text-faint);
        flex: none;
        font-size: 13px;
        width: 16px;
      }
      .tcall .a {
        color: var(--color-text);
        font-weight: var(--weight-medium);
        flex: none;
      }
      .tcall .p {
        color: var(--color-text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
        font-size: 12px;
      }
      .tcall .rt {
        margin-left: auto;
        color: var(--color-text-muted);
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
      }
      .tcall .tm {
        color: var(--color-text-faint);
        font-size: 11px;
      }
      .st-glyph {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        flex: none;
      }
      .st-glyph.run {
        border: 2px solid var(--color-accent-bd);
        border-top-color: var(--color-accent);
        animation: spin 0.8s linear infinite;
      }
      .st-glyph.ok {
        color: var(--color-success);
        border: 1px solid var(--color-success);
      }
      .st-glyph.err {
        color: var(--color-danger);
        border: 1px solid var(--color-danger);
      }
      .st-glyph.sus {
        background: var(--color-warning);
        border-radius: 2px;
        width: 8px;
        height: 8px;
      }
      .tcall .car {
        color: var(--color-text-faint);
        font-size: 10px;
        transition: transform 0.15s;
        flex: none;
      }
      .tcall.open .car {
        transform: rotate(90deg);
      }
      .tcall .bb {
        display: none;
      }
      .tcall .bb-pad {
        padding: 0;
      }
      .tcall pre {
        margin: 0;
        padding: 10px 12px;
        overflow-x: auto;
        font: 12px/1.55 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .tcall pre.term {
        background: #010409;
        color: #c9d1d9;
      }
      .diff .ad {
        color: var(--color-text-faint);
      }
      .diff .ap {
        color: var(--color-success);
      }
      .diff .am {
        color: var(--color-danger);
      }
      .diff .ah {
        color: var(--color-accent);
      }
      /* 审批卡 */
      #dock {
        flex: none;
        width: 100%;
        max-width: var(--p-content-max);
        margin: 0 auto;
        padding: 0 20px;
      }
      #dock .pc {
        margin: 6px 0;
      }
      .pc {
        border: 1px solid var(--color-line-strong);
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--color-surface);
        font-size: 13px;
      }
      .pc .ah {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: var(--color-surface);
      }
      .pc .ah-ic {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--color-surface-sunken);
        color: var(--color-text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: var(--weight-bold);
        flex: none;
      }
      .pc .akind {
        font-weight: var(--weight-semibold);
        color: var(--color-text);
      }
      .pc .apath {
        color: var(--color-text-muted);
        font: 12px var(--mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pc .aw {
        flex: 1;
        color: var(--color-warning);
        font-size: 12px;
        text-align: right;
      }
      .pc .body {
        padding: 0 14px;
      }
      .pc .shell-cmd {
        font: 13px/1.6 var(--mono);
        color: var(--color-text);
        padding: 8px 0;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .pc .shell-dollar {
        color: var(--color-accent);
        font-weight: var(--weight-medium);
        margin-right: 8px;
      }
      .pc .shell-cwd {
        font: 12px var(--mono);
        color: var(--color-text-muted);
        margin: 2px 0 8px;
      }
      .pc .diff {
        max-height: 220px;
        overflow: auto;
        font: 12px/1.5 var(--mono);
        border-top: 1px solid var(--color-line);
        border-bottom: 1px solid var(--color-line);
      }
      .pc .dl {
        display: flex;
        padding: 0 12px;
      }
      .pc .dl.add {
        background: var(--color-success-soft);
      }
      .pc .dl.del {
        background: var(--color-danger-soft);
      }
      .pc .dg {
        width: 30px;
        color: var(--color-text-muted);
        text-align: right;
        padding-right: 8px;
        user-select: none;
        flex: none;
      }
      .pc .dc {
        white-space: pre;
      }
      .pc .file-line {
        display: flex;
        padding: 0 12px;
        font: 12px/1.5 var(--mono);
      }
      .pc .file-ln {
        width: 30px;
        color: var(--color-text-muted);
        text-align: right;
        padding-right: 8px;
        user-select: none;
        flex: none;
      }
      .pc .file-text {
        white-space: pre;
      }
      .pc .pb {
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid var(--color-line);
      }
      .pc button {
        flex: 1;
        height: 32px;
        border-radius: var(--radius-md);
        font-weight: var(--weight-medium);
        font-size: 13px;
        color: var(--color-text-on-accent);
      }
      .pc .ok {
        background: var(--color-accent);
      }
      .pc .ok:hover {
        background: var(--color-accent-hover);
      }
      .pc .no {
        background: var(--color-surface-sunken);
        color: var(--color-text);
        border: 1px solid var(--color-line);
      }
      .pc .no:hover {
        color: var(--color-danger);
        border-color: var(--color-danger);
      }
      .pc .alw {
        background: var(--color-surface-sunken);
        color: var(--color-text);
        border: 1px solid var(--color-line);
      }
      .pc .alw:hover {
        border-color: var(--color-text-muted);
      }
      .sys-line {
        font: 12px/1.5 var(--mono);
        color: var(--color-text-faint);
        padding: 4px 2px 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .turn-meta {
        font-size: 11px;
        color: var(--color-text-faint);
        letter-spacing: 0.01em;
      }
      #qbox {
        max-width: var(--p-content-max);
        margin: 0 auto 8px;
        border: 1px solid var(--color-line);
        border-radius: 16px;
        background: var(--color-surface);
        overflow: hidden;
      }
      #qbox[hidden] {
        display: none;
      }
      .q-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px 0;
        font-size: 12px;
        color: var(--color-text-muted);
      }
      .q-head b {
        font-weight: var(--weight-semibold);
        color: var(--color-text);
      }
      .q-head .q-to {
        color: var(--color-text-faint);
      }
      .q-head button {
        margin-left: auto;
        height: 22px;
        padding: 0 8px;
        border: none;
        background: transparent;
        color: var(--color-text-faint);
        font-size: 12px;
      }
      .q-head button:hover {
        color: var(--color-text);
      }
      .q-item {
        padding: 8px 12px 10px;
        font-size: 14px;
        line-height: 1.45;
        color: var(--color-text);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .q-item + .q-item {
        border-top: 1px solid var(--color-line);
        padding-top: 10px;
      }
      /* ==== composer ==== */
      #cmp {
        flex: none;
        padding: 8px 20px max(12px, env(safe-area-inset-bottom));
        position: relative;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--bg) 0%, transparent) 0,
          var(--bg) 28px
        );
      }
      #app.hero .chat-header {
        border-bottom-color: transparent;
      }
      #app.hero #panes {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app.hero #wrap {
        min-height: 0;
        padding: 0 20px;
      }
      #app.hero #cmp {
        padding-bottom: 12vh;
        background: none;
      }
      #app.hero #dock,
      #app.hero #qbox {
        display: none;
      }
      #app.hero .empty-keys,
      #app.hero .empty-hint-text {
        display: none;
      }
      #cmp > * {
        position: relative;
        z-index: 1;
      }
      .act-strip {
        max-width: var(--p-content-max);
        width: 100%;
        margin: 0 auto 4px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 12px;
        color: var(--color-faint, #888);
        font-variant-numeric: tabular-nums;
      }
      .act-chip.bg { opacity: 0.7; }
      .cmp-row {
        max-width: var(--p-content-max);
        width: 100%;
        margin: 0 auto;
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .composer-card {
        flex: 1;
        position: relative;
        border: 1px solid var(--color-line);
        border-radius: 18px;
        background: var(--color-surface-raised);
        box-shadow: var(--shadow-lg);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        min-width: 0;
      }
      .composer-card:focus-within {
        border-color: var(--color-line-strong);
        box-shadow: var(--shadow-lg);
      }
      .cin-wrap {
        position: relative;
        padding: 10px 14px 2px;
      }
      #inp {
        color: var(--color-text);
        flex: 1;
        border: none;
        outline: none;
        resize: none;
        font-size: 16px;
        background: transparent;
        min-height: 36px;
        max-height: calc(100vh / 4);
        overflow-y: auto;
        line-height: 1.5;
        width: 100%;
        display: block;
      }
      #inp::placeholder {
        color: var(--color-text-faint);
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px 12px;
      }
      .toolbar-left,
      .toolbar-right {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .perm-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        color: var(--color-text);
        cursor: pointer;
        user-select: none;
      }
      .perm-pill:hover {
        background: var(--color-surface-sunken);
      }
      .perm-allow {
        color: var(--color-success);
      }
      .perm-deny {
        color: var(--color-danger);
      }
      .perm-ask {
        color: var(--color-warning);
      }
      .mode-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        color: var(--color-text-muted);
        cursor: pointer;
        user-select: none;
      }
      .mode-pill:hover {
        background: var(--color-surface-sunken);
      }
      .mode-pill.on {
        color: var(--color-accent);
      }
      .mode-tag {
        background: var(--color-accent-soft);
        color: var(--color-accent);
        border-radius: var(--radius-xs);
        padding: 0 4px;
        font-size: 11px;
      }
      #send {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--color-text);
        color: var(--color-bg);
        border: none;
        box-shadow: var(--shadow-xs);
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex: none;
        font-size: 13px;
      }
      #send:hover {
        filter: brightness(1.12);
      }
      #send:active {
        transform: scale(0.92);
      }
      #send:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #send.stop {
        background: var(--color-danger);
        width: 30px;
        height: 30px;
      }
      #send.stop:hover {
        background: var(--color-danger);
        filter: brightness(1.1);
      }
      .compact-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: none;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-xs);
        color: var(--color-warning);
        font-family: var(--mono);
        font-size: 13px;
        padding: 2px 8px;
        cursor: pointer;
      }
      .compact-chip:hover {
        background: var(--color-warning-soft);
      }
      /* ==== 菜单 ==== */
      .menu {
        position: fixed;
        min-width: 190px;
        background: var(--color-surface-raised);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        padding: 4px;
        box-shadow: var(--shadow-lg);
        z-index: var(--z-dropdown);
        display: none;
      }
      .menu.open {
        display: block;
      }
      .mi {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 13px;
        color: var(--color-text);
      }
      .mi:hover {
        background: var(--color-surface-sunken);
      }
      .mi.danger {
        color: var(--color-danger);
      }
      .mi .mk {
        margin-left: auto;
        color: var(--color-text-faint);
        font-size: 11px;
      }
      .menu .sep {
        border-top: 1px solid var(--color-line);
        margin: 4px 6px;
      }
      .mi.check::before {
        content: "✓";
        color: var(--color-accent);
        flex: none;
        font-size: 11px;
      }
      /* ==== toast ==== */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 60px;
        transform: translateX(-50%);
        background: var(--color-surface-raised);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        padding: 8px 16px;
        font-size: 13px;
        color: var(--color-text);
        box-shadow: var(--shadow-lg);
        z-index: var(--z-toast);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      #toast.show {
        opacity: 1;
      }
      /* SSE 断线条:顶部细带,不挡操作 */
      #ssebar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 4px 12px;
        text-align: center;
        font-size: 12px;
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 10%, var(--color-surface));
        border-bottom: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
        z-index: var(--z-toast);
        transform: translateY(-100%);
        transition: transform 0.25s ease;
        pointer-events: none;
      }
      #ssebar.on {
        transform: translateY(0);
      }
      /* ==== 移动端 ==== */
      .topbar {
        display: none;
        align-items: center;
        gap: 8px;
        height: 48px;
        padding: 0 12px;
        border-bottom: 1px solid var(--color-line);
        flex: none;
      }
      .topbar .wsq {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: var(--radius-full);
        font-size: 12px;
        color: var(--color-accent);
        border: 1px solid var(--color-accent-bd);
        background: var(--color-accent-soft);
        cursor: pointer;
      }
      .tb-mid {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        color: var(--color-text);
        text-align: left;
      }
      .tb-ws {
        color: var(--color-text-muted);
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tb-sl {
        color: var(--color-text-faint);
        flex: none;
      }
      .tb-se {
        font-weight: var(--weight-semibold);
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #sheet {
        display: none;
        position: fixed;
        inset: 0;
        z-index: var(--z-modal);
      }
      #sheet.open {
        display: block;
      }
      #scrim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
      }
      #spnl {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 86vh;
        background: var(--color-surface-raised);
        border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
        display: flex;
        flex-direction: column;
        transform: translateY(102%);
        transition: transform 0.28s ease-out;
        box-shadow: var(--shadow-lg);
      }
      #sheet.open #spnl {
        transform: translateY(0);
      }
      .grab {
        width: 38px;
        height: 5px;
        border-radius: 3px;
        background: var(--color-line-strong);
        margin: 8px auto 0;
        flex: none;
      }
      .shd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px 6px;
        flex: none;
      }
      .shd span {
        font-weight: var(--weight-semibold);
        font-size: 14px;
      }
      .shd button {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        color: var(--color-text-muted);
        font-size: 14px;
      }
      .shd button:hover {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      #sbody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 12px max(16px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      #sbody .se {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        border-radius: var(--radius-md);
      }
      #sbody .se .st {
        flex: 1;
      }
      #sbody .sg-sep {
        border-top: 1px solid var(--color-line);
        margin: 6px 8px;
      }
      /* 插件槽 */
      #plugin-header,
      #plugin-status {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #plugin-header:empty,
      #plugin-status:empty {
        display: none;
      }
      .piz-plugin-btn {
        height: 28px;
        min-width: 28px;
        padding: 0 9px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        color: var(--color-text-muted);
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;

        font: inherit;
        font-size: 13px;

        background: var(--color-accent);

        color: var(--color-text-on-accent);
      }
      .btn-p:hover {
        background: var(--color-accent-hover);

        background: var(--color-danger);

        border-radius: var(--radius-sm);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }

        background: var(--color-surface-sunken);
        color: var(--color-text);
        font-weight: 600;
      }
      .set-row {

        align-items: center;

        align-items: stretch;
        gap: 8px;
      }

        flex-direction: column;
        gap: 2px;

        color: var(--color-text-faint);

        border-radius: var(--radius-md);
        overflow: hidden;
        flex: none;

        border: 0;
        background: transparent;
        color: var(--color-text-muted);
        padding: 5px 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .seg button.on {
        background: var(--color-accent);
        color: var(--color-text-on-accent);
      }
      .num-in {
        width: 64px;
        border: 1px solid var(--color-line);
        background: var(--color-surface-sunken);
        color: var(--color-text);
        border-radius: var(--radius-sm);
        padding: 4px 6px;
        font: inherit;
        font-size: 13px;
      }
      .sw {
        width: 36px;
        height: 20px;
        border: 0;
        border-radius: 99px;
        background: var(--color-line-strong);
        position: relative;
        cursor: pointer;
        flex: none;
      }
      .sw.on {
        background: var(--color-accent);
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .sw.on::after {
        transform: translateX(16px);
      }
      .hit {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);

      .hit.on {
        background: var(--color-surface-sunken);

      .hit-s {
        font-size: 12px;
        color: var(--color-text-muted);

      .slash-menu {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        right: 0;
        padding: 6px;
        background: var(--color-surface-raised);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-xl);

        z-index: var(--z-dropdown);

        flex-direction: column;

        overflow-y: auto;
        min-height: 0;

      .slash-item {

        padding: 8px 10px;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: 13px;

      .slash-item:hover,
      .slash-item.active {
        background: var(--color-surface-sunken);
      }
      .slash-name {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--color-text);
      }
      .slash-desc {
        color: var(--color-text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .slash-foot {
        display: flex;
        gap: 10px;
        padding: 6px 10px 2px;
        color: var(--color-text-faint);
        font-size: 11px;
      }
      .cost-lbl {
        font: 12px/1 var(--mono);
        color: var(--color-text-faint);
        font-variant-numeric: tabular-nums;
        margin-right: 8px;
      }
      .ctx-wrap {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--color-text-muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        margin-right: 4px;
      }
      .ctx-ring {
        width: 16px;
        height: 16px;
        flex: none;
        transform: rotate(-90deg);
      }
      .ctx-ring-track {
        stroke: var(--color-line);
      }
      .ctx-ring-fill {
        stroke: var(--color-text-muted);
        transition: stroke-dashoffset 0.3s ease;
      }
      .empty-keys {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 18px;
        font-size: 12px;
        color: var(--color-text-muted);

      #keysHint {

        left: 50%;

        max-width: min(420px, calc(100vw - 32px));

        background: var(--color-surface-sunken);

        font-size: 11px;
        font-family: var(--mono);

    <div id="overlay"></div>
    <div id="sheet">
      <div id="scrim"></div>
      <div id="spnl">
        <div class="grab"></div>
        <div class="shd">
          <span id="stl">会话</span><button id="scls">✕</button>
        </div>
        <div id="sbody"></div>
      </div>
    </div>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      function histText(v) {
        if (typeof v === "string") return v;
        if (Array.isArray(v)) {
          try {
            return new TextDecoder("utf-8").decode(Uint8Array.from(v));
          } catch {
            return "";
          }
        }
        return v == null ? "" : String(v);
      }
      const qp = new URLSearchParams(location.search);
      const sess = qp.get("session") || "default";
      const ws = decodeURIComponent(qp.get("ws") || "");
      const wsp = ws ? "ws=" + encodeURIComponent(ws) + "&" : "";
      const isMobile = () => window.innerWidth < 840;
      const PREF_KEY = "piz.prefs";
      const prefs = {
        scheme: "dark",
        accent: "mono",
        accentPicked: false,
        uiFont: 14,
        notify: false,
        sound: false,
      };
      try {
        Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || "{}"));
      } catch {}
      if (!prefs.accentPicked) prefs.accent = "mono";
      try {
        const old = localStorage.getItem("piz.scheme");
        if (old && !localStorage.getItem(PREF_KEY)) prefs.scheme = old;
      } catch {}
      function savePrefs() {
        try {
          localStorage.setItem(PREF_KEY, JSON.stringify(prefs));
        } catch {}
      }
      function setScheme(v) {
        const map = { auto: "system", light: "light", dark: "dark", system: "system" };
        const next = map[String(v || "").trim()];
        if (!next) return false;
        prefs.scheme = next;
        savePrefs();
        applyScheme();
        return true;
      }
      function applyScheme() {
        const root = document.documentElement;
        root.dataset.colorScheme = prefs.scheme || "dark";
        root.dataset.accent = prefs.accent || "mono";
        const fs = (prefs.uiFont || 14) + "px";
        root.style.setProperty("--ui-font-size", fs);
        root.style.setProperty("--text-base", fs);
        const dark =
          prefs.scheme === "dark" ||
          (prefs.scheme === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        const tm = document.querySelector('meta[name="theme-color"]');
        if (tm) tm.setAttribute("content", dark ? "#151517" : "#ffffff");
      }
      applyScheme();
      if (window.matchMedia) {
        try {
          matchMedia("(prefers-color-scheme: dark)").addEventListener(
            "change",
            applyScheme,
          );
        } catch {}
      }
      try {
        if (localStorage.getItem("piz.sidebar") === "1")
          document.body.classList.add("collapsed");
      } catch {}
      // ---- 服务器凭证(kimi serverAuth.ts:#token= fragment + sessionStorage) ----
      const AUTH_KEY = "piz-web.credential";
      let credential = undefined;
      function readFragmentToken() {
        const hash = location.hash || "";
        if (!hash.startsWith("#")) return undefined;
        const params = new URLSearchParams(hash.slice(1));
        const token = params.get("token");
        if (!token) return undefined;
        const url = new URL(location.href);
        url.hash = "";
        history.replaceState(history.state, "", url.pathname + url.search);
        return token;
      }
      function initServerAuth() {
        const frag = readFragmentToken();
        if (frag) { setCredential(frag); return true; }
        try {
          const stored = sessionStorage.getItem(AUTH_KEY);
          if (stored) { credential = stored; return true; }
        } catch {}
        return false;
      }
      function setCredential(v) {
        credential = v;
        try { sessionStorage.setItem(AUTH_KEY, v); } catch {}
      }
      function clearCredential() {
        credential = undefined;
        try { sessionStorage.removeItem(AUTH_KEY); } catch {}
      }
      function showAuthPage(msg) {
        $("splash")?.classList.add("hide");
        $("authPage")?.classList.add("show");
        if (msg) $("authErr").textContent = msg;
        const inp = $("authTok");
        if (inp) { inp.disabled = false; inp.focus(); }
        const btn = $("authBtn");
        if (btn) btn.disabled = true;
      }
      function hideAuthPage() {
        $("authPage")?.classList.remove("show");
        $("authErr").textContent = "";
      }
      // fetch 全局包装:带 Bearer + 401 → 登录页(kimi http.ts 等价)
      const rawFetch = window.fetch.bind(window);
      window.fetch = (url, opts = {}) => {
        opts = Object.assign({}, opts);
        opts.headers = Object.assign({}, opts.headers || {});
        if (credential) opts.headers["Authorization"] = "Bearer " + credential;
        return rawFetch(url, opts).then((res) => {
          if (res.status === 401 && !opts.headers["X-Skip-Auth"]) {
            clearCredential();
            showAuthPage("凭证无效或已过期,请重新输入");
          }
          return res;
        });
      };
      // 登录提交
      const authInp = $("authTok");
      authInp.addEventListener("input", () => {
        $("authBtn").disabled = !authInp.value.trim();
      });
      authInp.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && authInp.value.trim() && !$("authBtn").disabled)
          submitAuth();
      });
      async function submitAuth() {
        const v = authInp.value.trim();
        if (!v) return;
        $("authBtn").disabled = true;
        authInp.disabled = true;
        setCredential(v);
        try {
          const r = await rawFetch("/api/state?" + wsp + "session=" + encodeURIComponent(sess), {
            headers: { Authorization: "Bearer " + v, "X-Skip-Auth": "1" },
          });
          if (r.ok) {
            hideAuthPage();
            boot();
          } else {
            clearCredential();
            $("authErr").textContent = "连接失败,请检查 token";
            authInp.disabled = false;
            authInp.focus();
            $("authBtn").disabled = false;
          }
        } catch (e) {
          clearCredential();
          $("authErr").textContent = "无法连接服务器";
          authInp.disabled = false;
          $("authBtn").disabled = false;
        }
      }
      $("authBtn").onclick = submitAuth;
      // ---- toast ----
      const toastEl = $("toast");
      let toastT = null;
      function showToast(t) {
        toastEl.textContent = t;
        toastEl.classList.add("show");
        clearTimeout(toastT);
        toastT = setTimeout(() => toastEl.classList.remove("show"), 2200);
      }
      let dlgOnok = null,
        dlgOncancel = null;
      let dlgPrevFocus = null;
      function closeDlg() {
        const ov = $("overlay");
        ov.classList.remove("open", "sheet");
        ov.innerHTML = "";
        dlgOnok = dlgOncancel = null;
        // 焦点还给弹出前的元素(还在文档里才还)。
        if (dlgPrevFocus && document.contains(dlgPrevFocus)) {
          try { dlgPrevFocus.focus({ preventScroll: true }); } catch {}
        }
        dlgPrevFocus = null;
      }
      function openDlg(opts) {
        if (typeof closeMenus === "function") closeMenus();
        if (typeof hideSlash === "function") hideSlash();
        if (typeof hideBang === "function") hideBang();
        const ov = $("overlay");
        ov.classList.add("open");
        if (opts.cls === "set") ov.classList.add("sheet");
        ov.innerHTML =
          '<div class="dlg ' +
          (opts.cls || "") +
          '" role="dialog"><div class="dlg-hd"><span>' +
          esc(opts.title || "") +
          '</span><button class="dlg-x" id="dlgX" type="button">✕</button></div><div class="dlg-bd">' +
          (opts.body || "") +
          "</div>" +
          (opts.ok
            ? '<div class="dlg-ft">' +
              (opts.cancel
                ? '<button class="btn" id="dlgCancel" type="button">' +
                  esc(opts.cancel) +
                  "</button>"
                : "") +
              '<button class="btn ' +
              (opts.danger ? "btn-d" : "btn-p") +
              '" id="dlgOk" type="button">' +
              esc(opts.ok) +
              "</button></div>"
            : "") +
          "</div>";
        dlgOnok = opts.onok || null;
        dlgOncancel = opts.oncancel || null;
        dlgPrevFocus = document.activeElement; // 关时还原焦点
        $("dlgX").onclick = () => {
          if (dlgOncancel) dlgOncancel();
          closeDlg();
        };
        const cxl = $("dlgCancel");
        if (cxl)
          cxl.onclick = () => {
            if (dlgOncancel) dlgOncancel();
            closeDlg();
          };
        const ok = $("dlgOk");
        if (ok)
          ok.onclick = () => {
            const r = dlgOnok && dlgOnok();
            if (r !== false) closeDlg();
          };
        ov.onclick = (e) => {
          if (e.target === ov) {
            if (dlgOncancel) dlgOncancel();
            closeDlg();
          }
        };
        if (opts.focus && $(opts.focus)) {
          const el = $(opts.focus);
          el.focus();
          if (el.select) el.select();
        } else {
          // 默认焦点给第一个可输入控件,否则给主按钮 —— 键盘流不用先 Tab 一圈。
          const el = ov.querySelector(
            ".dlg-bd input, .dlg-bd textarea, .dlg-bd select, .dlg-bd button",
          );
          const btn = el || $("dlgOk");
          if (btn) btn.focus({ preventScroll: true });
        }
      }
      function askText(title, value, placeholder) {
        return new Promise((resolve) => {
          openDlg({
            title,
            body:
              '<input id="dlgIn" class="dlg-in" value="' +
              esc(value || "") +
              '" placeholder="' +
              esc(placeholder || "") +
              '">',
            ok: "确定",
            cancel: "取消",
            focus: "dlgIn",
            onok: () => {
              resolve($("dlgIn").value);
            },
            oncancel: () => resolve(null),
          });
          $("dlgIn").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              resolve($("dlgIn").value);
              closeDlg();
            }
          });
        });
      }
      function askYes(title, msg) {
        return new Promise((resolve) => {
          openDlg({
            title,
            body: '<p class="dlg-msg">' + esc(msg) + "</p>",
            ok: "确定",
            danger: true,
            cancel: "取消",
            onok: () => resolve(true),
            oncancel: () => resolve(false),
          });
        });
      }
      function segHtml(name, opts, cur) {
        return (
          '<div class="seg" data-seg="' +
          name +
          '">' +
          opts
            .map(
              (o) =>
                '<button type="button" data-v="' +
                esc(o.v) +
                '" class="' +
                (o.v === cur ? "on" : "") +
                '">' +
                esc(o.l) +
                "</button>",
            )
            .join("") +
          "</div>"
        );
      }
      function bindSeg(name, fn) {
        const box = document.querySelector('[data-seg="' + name + '"]');
        if (!box) return;
        box.onclick = (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          for (const x of box.querySelectorAll("button")) x.classList.remove("on");
          b.classList.add("on");
          fn(b.getAttribute("data-v"));
        };
      }
      function authPanelHtml(cfg) {
        const keysFirst = [
          "deepseek",
          "openai",
          "anthropic",
          "xai",
          "openrouter",
          "groq",
          "mistral",
          "together",
          "fireworks",
          "cerebras",
          "moonshotai",
          "huggingface",
          "nvidia",
          "zai",
          "minimax",
        ];
        const src = cfg.providers || [];
        const by = {};
        src.forEach((p) => {
          by[p.name] = p;
        });
        const list = keysFirst.map((n) => by[n] || { name: n, hasKey: false });
        const oauthLabel = {
          openrouter: "Sign in with OpenRouter",
          xai: "Sign in with xAI",
          openai: "Sign in with ChatGPT",
        };
        return (
          '<div class="set-row"><div class="set-lab">API keys<span class="set-hint">Built-in providers. Paste a key and Save.</span></div></div>' +
          list
            .map((p) => {
              const oauthl = oauthLabel[p.name];
              return (
                '<div class="set-row auth-row" data-prov="' +
                esc(p.name) +
                '"><div class="set-lab">' +
                esc(p.name) +
                '<span class="set-hint">' +
                (p.hasKey ? "key set" : "no key") +
                '</span></div><div class="auth-actions"><input class="set-sel auth-key" type="password" placeholder="API key" autocomplete="off">' +
                '<button type="button" class="btn auth-save">Save</button>' +
                (oauthl ? '<button type="button" class="btn auth-oauth">' + oauthl + "</button>" : "") +
                '</div><div class="set-hint auth-dev" hidden></div></div>'
              );
            })
            .join("")
        );
      }
      function bindAuthPanel() {
        document.querySelectorAll(".auth-row").forEach((row) => {
          const name = row.getAttribute("data-prov");
          const inp = row.querySelector(".auth-key");
          const save = row.querySelector(".auth-save");
          const oauthBtn = row.querySelector(".auth-oauth");
          if (save)
            save.onclick = () => {
              const key = (inp && inp.value) || "";
              if (!key) {
                showToast("paste an API key");
                return;
              }
              fetch("/api/config", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ setAuth: { name, key } }),
              })
                .then((r) => r.json())
                .then((j) => {
                  showToast(j && j.ok ? "saved " + name : "save failed");
                  if (inp) inp.value = "";
                })
                .catch(() => showToast("save failed"));
            };
          if (oauthBtn)
            oauthBtn.onclick = async () => {
              const hint = row.querySelector(".auth-dev");
              try {
                const r = await fetch("/api/oauth/start", {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  body: JSON.stringify({ provider: name }),
                });
                const j = await r.json();
                if (!j || !j.ok) {
                  showToast("oauth start failed");
                  return;
                }
                if (j.user_code) {
                  if (hint) {
                    hint.hidden = false;
                    hint.textContent = "Enter code " + j.user_code + " at " + (j.verification_uri || "");
                  }
                  if (j.verification_uri) window.open(j.verification_uri, "_blank");
                  showToast("code " + j.user_code);
                } else if (j.url) {
                  window.open(j.url, "_blank");
                  showToast("finish sign-in in the new tab");
                } else {
                  showToast("oauth start failed");
                  return;
                }
                const path = j.user_code ? "/api/oauth/poll?state=" : "/api/oauth/status?state=";
                const t0 = Date.now();
                const tick = async () => {
                  if (Date.now() - t0 > 180000) {
                    showToast("oauth timed out");
                    return;
                  }
                  const s = await fetch(path + encodeURIComponent(j.state)).then((x) => x.json());
                  if (s && s.done && s.ok) {
                    showToast("signed in");
                    if (hint) hint.hidden = true;
                    return;
                  }
                  if (s && s.done && !s.ok) {
                    showToast("sign-in failed");
                    return;
                  }
                  setTimeout(tick, 1500);
                };
                setTimeout(tick, 1500);
              } catch {
                showToast("oauth start failed");
              }
            };
        });
      }
      function packageRows(data) {
        const user = data && Array.isArray(data.user) ? data.user : [];
        const proj = data && Array.isArray(data.project) ? data.project : [];
        if (!user.length && !proj.length) {
          return '<div class="set-row"><div class="set-lab">资源包<span class="set-hint">piz pkg install &lt;path&gt; [-l]</span></div></div>';
        }
        function one(p, scope) {
          return (
            '<div class="set-row"><div class="set-lab">' +
            esc(p.name || "") +
            '<span class="set-hint">' +
            scope +
            " · skills:" +
            (p.skills || 0) +
            " prompts:" +
            (p.prompts || 0) +
            (p.web ? " · web" : "") +
            "</span></div></div>"
          );
        }
        let html =
          '<div class="set-row"><div class="set-lab">资源包<span class="set-hint">用户 ~/.piz/packages 与项目 .piz/packages</span></div></div>';
        for (const p of user) html += one(p, "user");
        for (const p of proj) html += one(p, "project");
        return html;
      }
      function pluginRows(list) {
        const plugs = Array.isArray(list) ? list.filter((p) => p && p.optional) : [];
        if (!plugs.length) return "";
        let html =
          '<div class="set-row"><div class="set-lab">插件<span class="set-hint">task-delegation 才有 workflow / 子代理。开关后下一轮生效。</span></div></div>';
        for (const p of plugs) {
          html +=
            '<div class="set-row"><div class="set-lab">' +
            esc(p.name) +
            '</div><button type="button" class="sw' +
            (p.enabled ? " on" : "") +
            '" data-plugin="' +
            esc(p.name) +
            '"></button></div>';
        }
        return html;
      }
      async function openSettings() {
        let cfg = {};
        let models = [];
        let pkgs = { user: [], project: [] };
        try {
          const [cr, mr, pr] = await Promise.all([
            fetch("/api/config"),
            fetch("/api/models"),
            fetch("/api/packages?" + wsp),
          ]);
          cfg = await cr.json();
          models = await mr.json();
          if (!Array.isArray(models)) models = [];
          pkgs = await pr.json();
        } catch {}
        const defThink = cfg.defaultThinkingLevel || curThink || "high";
        const defAppr = cfg.approvalMode || "yolo";
        const defModel = cfg.defaultModel || "";
        const thinkOpts = (typeof THINK_LEVELS !== "undefined" ? THINK_LEVELS : ["off", "low", "medium", "high"]).map(
          (v) => ({ v, l: v }),
        );
        const apprOpts = (typeof APPROVALS !== "undefined" ? APPROVALS : []).map((x) => ({ v: x.id, l: x.label }));
        function optHtml(id, cur, list) {
          const xs = list.slice();
          if (cur && xs.indexOf(cur) < 0) xs.unshift(cur);
          if (!xs.length) xs.push(cur || "");
          return (
            '<select id="' +
            id +
            '" class="set-sel">' +
            xs
              .map(
                (m) =>
                  '<option value="' +
                  esc(m) +
                  '"' +
                  (m === cur ? " selected" : "") +
                  ">" +
                  esc(m) +
                  "</option>",
              )
              .join("") +
            "</select>"
          );
        }
        const provHtml =
          (cfg.providers || [])
            .map(
              (p) =>
                '<div class="set-row"><div class="set-lab">' +
                esc(p.name || "") +
                '<span class="set-hint">' +
                esc(p.api || "") +
                (p.hasKey ? " · 已配 key" : " · 无 key") +
                "</span></div></div>",
            )
            .join("") ||
          '<div class="set-row"><div class="set-lab">无自定义 provider<span class="set-hint">见 ~/.piz/models.json</span></div></div>';
        openDlg({
          cls: "set",
          title: "设置",
          body:
            '<div class="set-tabs" id="setTabs"><button type="button" data-tab="auth" class="on">Account</button><button type="button" data-tab="look">外观</button><button type="button" data-tab="agent">智能体</button><button type="button" data-tab="note">通知</button><button type="button" data-tab="about">关于</button></div>' +
            '<div id="setAuth">' +
            authPanelHtml(cfg) +
            "</div>" +
            '<div id="setLook" hidden>' +
            '<div class="set-row"><div class="set-lab">配色</div>' +
            segHtml("scheme", [{ v: "light", l: "浅色" }, { v: "dark", l: "深色" }, { v: "system", l: "系统" }], prefs.scheme) +
            "</div>" +
            '<div class="set-row"><div class="set-lab">强调色</div>' +
            segHtml("accent", [{ v: "mono", l: "墨" }, { v: "blue", l: "蓝" }], prefs.accent) +
            "</div>" +
            '<div class="set-row"><div class="set-lab">界面字号</div><input id="setFont" class="num-in" type="number" min="12" max="20" value="' +
            (prefs.uiFont || 14) +
            '"></div></div>' +
            '<div id="setAgent" hidden>' +
            '<div class="set-row"><div class="set-lab">本会话模型</div>' +
            optHtml("setSessModel", curModel, models) +
            "</div>" +
            '<div class="set-row"><div class="set-lab">思考等级<span class="set-hint">写入默认并作用于当前会话</span></div>' +
            segHtml("think", thinkOpts, defThink) +
            "</div>" +
            '<div class="set-row"><div class="set-lab">本会话授权</div>' +
            segHtml("sessappr", apprOpts.length ? apprOpts : [{ v: "yolo", l: "yolo" }, { v: "ask", l: "ask" }, { v: "read-only", l: "read-only" }], approvalMode) +
            "</div>" +
            '<div class="set-row"><div class="set-lab">新会话默认授权</div>' +
            segHtml("defappr", apprOpts.length ? apprOpts : [{ v: "yolo", l: "yolo" }, { v: "ask", l: "ask" }, { v: "read-only", l: "read-only" }], defAppr) +
            "</div>" +
            '<div class="set-row"><div class="set-lab">bash 沙箱<span class="set-hint">workspace 工作区可写；strict 再断网</span></div>' +
            segHtml("sandbox", [{ v: "off", l: "off" }, { v: "workspace", l: "workspace" }, { v: "strict", l: "strict" }], cfg.sandboxMode || "off") +
            "</div>" +
            '<div class="set-row"><div class="set-lab">默认模型<span class="set-hint">新会话用</span></div>' +
            optHtml("setDefModel", defModel || curModel, models) +
            "</div>" +
            pluginRows(cfg.plugins) +
            packageRows(pkgs) +
            "</div>" +
            '<div id="setNote" hidden>' +
            '<div class="set-row"><div class="set-lab">完成时通知<span class="set-hint">浏览器系统通知</span></div><button type="button" class="sw' +
            (prefs.notify ? " on" : "") +
            '" id="swNotify"></button></div>' +
            '<div class="set-row"><div class="set-lab">完成时提示音</div><button type="button" class="sw' +
            (prefs.sound ? " on" : "") +
            '" id="swSound"></button></div></div>' +
            '<div id="setAbout" hidden>' +
            '<div class="set-row"><div class="set-lab">piz web<span class="set-hint">配置见 ~/.piz/</span></div></div>' +
            '<div class="set-row"><div class="set-lab">快捷键<span class="set-hint"><kbd>Ctrl</kbd><kbd>K</kbd> 搜会话 · <kbd>Ctrl</kbd><kbd>,</kbd> 设置 · <kbd>/</kbd> 命令 · <kbd>@./</kbd> 文件 · <kbd>!</kbd> 命令</span></div></div>' +
            provHtml +

      function openSearch() {
        const hits = sessList.slice();

            '<input id="dlgIn" class="dlg-in" placeholder="按标题或名字过滤…">' +
            '<div id="hitList" style="margin-top:8px;max-height:50vh;overflow:auto"></div>',
          focus: "dlgIn",
        });
        const box = $("hitList");
        const inp = $("dlgIn");
        function paint() {
          const q = (inp.value || "").toLowerCase().trim();
          const shown = [];
          for (const s of hits) {
            const title = s.title || s.name || "";
            const name = s.name || "";
            if (q && !title.toLowerCase().includes(q) && !name.toLowerCase().includes(q))
              continue;
            shown.push(s);
            if (shown.length >= 80) break;
          }
          if (sel >= shown.length) sel = Math.max(0, shown.length - 1);
          box.innerHTML = shown.length
            ? shown
                .map(
                  (s, i) =>
                    '<div class="hit' +
                    (i === sel ? " on" : "") +
                    '" data-name="' +
                    esc(s.name) +
                    '"><div class="hit-t">' +
                    esc(s.title || s.name) +
                    '</div><div class="hit-s">' +
                    esc(s.name) +
                    (s.msgs ? " · " + s.msgs + " 条" : "") +
                    "</div></div>",
                )
                .join("")
            : '<div class="dlg-msg">无匹配会话</div>';
          const on = box.querySelector(".hit.on");
          if (on) on.scrollIntoView({ block: "nearest" });
          return shown;
        }
        function go(name) {
          if (!name) return;
          closeDlg();
          location.href =
            "/?session=" +
            encodeURIComponent(name) +
            (ws ? "&ws=" + encodeURIComponent(ws) : "");
        }
        inp.addEventListener("input", () => {
          sel = 0;
          paint();
        });
        inp.addEventListener("keydown", (e) => {
          const shown = paint();
          if (e.key === "ArrowDown") {
            e.preventDefault();
            sel = Math.min(shown.length - 1, sel + 1);
            paint();
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            sel = Math.max(0, sel - 1);
            paint();
          } else if (e.key === "Enter") {
            e.preventDefault();
            if (shown[sel]) go(shown[sel].name);
          }
        });

          const ids = (Array.isArray(o.nodes) ? o.nodes.map((n) => n && n.id) : this.nodesFrom(out).map((n) => n.id))

            nodes.push({
              id: m[1],

              last: "",

          if (!m) return "";

            .map((n, i) => ({

              role: (n && n.role) || "",
              needs: Array.isArray(n && n.needs) ? n.needs : [],

              last: "",
              body: "",

        event(idx, kind, text) {

      function md(raw) {

        let m;
        while ((m = re.exec(t)) !== null) {

          const c = m[1].split(";").filter(Boolean);
          if (c.includes("0") || c.length === 0) fg = null;
          else {

            if (col) fg = col;
          }
          last = m.index + m[0].length;

      function mdInline(s) {

        s = s.replace(/(^|[^\*])\*(?!\*)([^*]+)\*(?!\*)/g, "$1<em>$2</em>");
        s = s.replace(
          /\[([^\]]+)\]\((https?:[^)\s]+)\)/g,

      function mdBlocks(s) {
        const lines = String(s).replace(/\r\n/g, "\n").split("\n");

        const flushP = () => {
          if (!para.length) return;
          html += "<p>" + mdInline(para.join(" ")) + "</p>";
          para = [];
        };
        while (i < lines.length) {
          const line = lines[i];
          if (/^\s*$/.test(line)) {
            flushP();
            i++;
            continue;
          }
          const hm = /^(#{1,3})\s+(.+)$/.exec(line);
          if (hm) {
            flushP();
            html += "<h" + hm[1].length + ">" + mdInline(hm[2]) + "</h" + hm[1].length + ">";
            i++;
            continue;
          }
          if (/^---+$/.test(line.trim())) {
            flushP();
            html += "<hr/>";
            i++;
            continue;
          }
          if (/^>\s?/.test(line)) {
            flushP();
            const qs = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) {
              qs.push(lines[i].replace(/^>\s?/, ""));

            continue;

          if (/^\s*[-*]\s+/.test(line)) {

            html += "<ul>";
            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
              html += "<li>" + mdInline(lines[i].replace(/^\s*[-*]\s+/, "")) + "</li>";

          if (/^\s*\d+\.\s+/.test(line)) {
