      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--color-text);
        font: var(--text-base)/var(--leading-normal) var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: transparent;
        border: none;
      }
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-line-strong);
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-accent-bd);
      }
      @keyframes bubble-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* ==== 连接 splash(kimi GlobalLoading) ==== */
      .gload {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        transition: opacity 0.3s;
      }
      .gload.hide {
        opacity: 0;
        pointer-events: none;
      }
      .gload-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .gload-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .gload-logo {
        width: 34px;
        height: 25px;
        color: var(--logo);
        animation: fadein 0.4s ease-out;
      }
      .gload-word,
      .auth-word {
        font-size: 26px;
        line-height: 32px;
        font-weight: 500;
        letter-spacing: -0.04em;
        color: var(--color-text);
      }
      .gload-text {
        font-size: 13px;
        color: var(--color-text-muted);
      }
      /* ==== 登录页(kimi auth-page) ==== */
      .auth-page {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        animation: fadein 0.3s ease-out;
      }
      .auth-page.show {
        display: flex;
      }
      .auth-page-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-width: 340px;
        text-align: center;
        padding: 24px;
      }
      .auth-page-logo {
        width: 34px;
        height: 25px;
        color: var(--logo);
      }
      .auth-page h1 {
        font-size: 19px;
        font-weight: var(--weight-semibold);
      }
      .auth-page p {
        font-size: 13px;
        color: var(--color-text-muted);
        line-height: 1.6;
      }
      .auth-page input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        color: var(--color-text);
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s;
      }
      .auth-page input:focus {
        border-color: var(--color-accent);
        box-shadow: 0 0 0 3px var(--color-accent-soft);
      }
      .auth-page button {
        width: 100%;
        height: 36px;
        border-radius: var(--radius-md);
        background: var(--color-accent);
        color: var(--color-text-on-accent);
        font-weight: var(--weight-medium);
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .auth-page button:hover {
        background: var(--color-accent-hover);
      }
      .auth-page button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .auth-err {
        font-size: 12px;
        color: var(--color-danger);
      }
      /* ==== 布局 ==== */
      .app {
        --side-w: 268px;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: var(--side-w) minmax(0, 1fr);
        background: var(--bg);
        color: var(--color-text);
        overflow: hidden;
        height: 100vh;
      }
      #side {
        border-right: 1px solid var(--color-line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .side-rail {
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding-top: 8px;
        border-right: 1px solid var(--color-line);
        background: var(--panel);
      }
      body.collapsed .app {
        grid-template-columns: 44px minmax(0, 1fr);
      }
      body.collapsed .side-rail {
        display: flex;
      }
      body.collapsed #side {
        display: none;
      }
      #main {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        position: relative;
      }
      /* ==== 侧栏 ==== */
      .ch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 56px;
        padding: 8px 12px;
        box-sizing: border-box;
      }
      .ch-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
        color: var(--logo);
        cursor: pointer;
      }
      .ch-logo {
        width: 24px;
        height: 18px;
        flex: none;
        color: inherit;
        transform-origin: 50% 60%;
      }
      .ch-name {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.04em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @keyframes logo-swim {
        0%,
        100% {
          transform: translate(0, 0) rotate(0);
        }
        35% {
          transform: translate(-1px, -1px) rotate(-5deg);
        }
        70% {
          transform: translate(1px, 0) rotate(3deg);
        }
      }
      @media (hover: hover) and (prefers-reduced-motion: no-preference) {
        .ch-brand:hover .ch-logo,
        .empty-headline:hover .empty-logo {
          animation: logo-swim 0.45s ease;
        }
      }
      .ch-ib {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-muted);
        flex: none;
      }
      .ch-ib:hover {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        margin: 0 10px 10px;
        padding: 0 12px;
        border-radius: 10px;
        color: var(--color-text-muted);
        background: var(--color-surface-sunken);
      }
      .search:hover {
        background: var(--color-surface-sunken);
      }
      .search-ic {
        flex: none;
        font-size: 12px;
        opacity: 0.8;
      }
      .search-t {
        font-size: 13px;
        color: var(--color-text-faint);
      }
      .btn-new-chat {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 38px;
        margin: 0 10px 10px;
        padding: 0 16px;
        border: 1px solid var(--color-line-strong);
        border-radius: 12px;
        background: var(--color-surface-raised);
        color: var(--color-text);
        font-size: 14px;
        font-weight: 500;
      }
      .btn-new-chat:hover {
        background: var(--color-surface);
      }
      .btn-add-proj {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
        margin: 4px 10px 8px;
        padding: 0 10px;
        border-radius: 8px;
        color: var(--color-text-muted);
        font-size: 13px;
      }
      .btn-add-proj:hover {
        background: var(--hover);
        color: var(--color-text);
      }
      .btn-new-chat .pl {
        color: var(--color-accent);
        font-size: 14px;
      }
      .sessions {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px 8px;
        min-height: 0;
      }
      .side-lab {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--color-text-faint);
        padding: 10px 8px 4px;
      }
      .sg-head {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 8px;
        margin: 0 4px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        user-select: none;
      }
      .sg-head.on {
        background: var(--color-surface-sunken);
      }
      .sg-chats {
        padding: 2px 0 8px 14px;
      }
      .sg-chev {
        font-size: 9px;
        color: var(--color-text-faint);
        transition: transform 0.15s;
        flex: none;
      }
      .sg-chev.open {
        transform: rotate(90deg);
      }
      .sg-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        font-weight: var(--weight-medium);
        color: var(--color-text-muted);
      }
      .sg-cnt {
        font-size: 11px;
        color: var(--color-text-faint);
      }
      .sg-ib {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-faint);
        font-size: 12px;
        opacity: 0;
      }
      .sg-head:hover .sg-ib,
      .sg-ib.open {
        opacity: 1;
      }
      .sg-ib:hover {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      .se {
        display: block;
        padding: 4px 8px;
        border-radius: var(--radius-md);
        cursor: pointer;
      }
      .se:hover {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      .se.on {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      .srow {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        min-height: 32px;
      }
      .lead {
        width: 16px;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .unread-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--color-text);
      }
      .spin {
        width: 12px;
        height: 12px;
        border: 2px solid var(--color-accent-bd);
        border-top-color: var(--color-accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .st {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        color: inherit;
      }
      .sts {
        font-size: 11px;
        color: var(--color-text-faint);
        flex: none;
        display: none;
      }
      .se:hover .sts {
        display: inline;
      }
      .tag {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: var(--radius-full);
        font-weight: var(--weight-medium);
        flex: none;
        display: none;
      }
      .se:hover .tag {
        display: inline;
      }
      .tag.warn {
        background: var(--color-warning-soft);
        color: var(--color-warning);
        border: 1px solid var(--color-warning-bd);
      }
      .tag.info {
        background: var(--color-accent-soft);
        color: var(--color-accent-hover);
        border: 1px solid var(--color-accent-bd);
      }
      .tag.danger {
        background: var(--color-danger-soft);
        color: var(--color-danger);
        border: 1px solid var(--color-danger-bd);
      }
      .se .kebab {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-muted);
        font-size: 13px;
        flex: none;
        visibility: hidden;
      }
      .se:hover .kebab,
      .kebab.open {
        visibility: visible;
      }
      .se .kebab:hover {
        background: var(--color-surface-raised);
        color: var(--color-text);
      }
      .sg-arch {
        font-size: 10px;
        letter-spacing: 0.5px;
        color: var(--color-text-faint);
        padding: 6px 8px 2px;
        text-transform: uppercase;
      }
      .se.arch .st {
        color: var(--color-text-faint);
      }
      /* ==== 聊天头 ==== */
      .chat-header {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 20px;
        border-bottom: 1px solid var(--color-line);
        flex: none;
        min-width: 0;
      }
      .ch-id {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        flex: none;
        max-width: 46%;
      }
      .ch-ws {
        color: var(--color-text-muted);
        font-size: 14px;
        font-weight: var(--weight-medium);
        flex: none;
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 4px 8px;
        border-radius: 12px;
        cursor: pointer;
      }
      .ch-ws:hover {
        background: var(--hover);
        color: var(--color-text);
      }
      .ch-sep {
        color: var(--color-text-faint);
        flex: none;
      }
      .ch-ses {
        font-size: 14px;
        font-weight: var(--weight-semibold);
        flex: none;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 12px;
      }
      .ch-ses:hover {
        background: var(--hover);
      }
      .ch-git {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
      }
      .ch-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-full);
        font-size: 11.5px;
        color: var(--color-text-muted);
        white-space: nowrap;
        flex: none;
      }
      .ch-pill b {
        font-weight: var(--weight-semibold);
      }
      .ch-ahead {
        color: var(--color-warning);
        flex: none;
        font-size: 11.5px;
      }
      .ch-behind {
        color: var(--color-accent-hover);
        flex: none;
        font-size: 11.5px;
      }
      .ch-spacer {
        flex: 1;
        min-width: 0;
      }
      .ib {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-muted);
        flex: none;
      }
      .ib:hover {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      .ib.open {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      /* ==== 聊天区 ==== */
      #panes {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        position: relative;
      }
      #wrap {
        width: 100%;
        max-width: var(--p-content-max);
        min-height: 100%;
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        padding: 24px 20px 24px;
      }
      #wrap.mobile {
        max-width: none;
        padding: 14px 12px 24px;
      }
      #thread {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .empty-spacer {
        flex: 1;
      }
      .empty-hint {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px 0 8px;
        text-align: center;
      }
      .ws-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: min(100%, 360px);
        min-height: 28px;
        padding: 0 10px;
        border-radius: 16px;
        color: var(--color-text);
        font-size: 13px;
        font-weight: 500;
      }
      .ws-chip:hover {
        background: var(--hover);
      }
      .ws-chip-ic,
      .ws-chip-chev {
        color: var(--color-text-muted);
        font-size: 12px;
      }
      .empty-headline {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--color-text);
      }
      .empty-logo {
        width: 34px;
        height: 25px;
        color: var(--color-text);
      }
      .empty-hint-title {
        font-size: 26px;
        line-height: 32px;
        font-weight: 500;
        letter-spacing: -0.04em;
      }
      .empty-hint-text {
        font-size: 14px;
        line-height: 1.55;
        color: var(--color-text-muted);
        max-width: 28em;
      }
      .ws-pick {
        margin-top: 12px;
      }
      .ws-pick-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        color: var(--color-text);
        font-size: 13px;
      }
      .ws-pick-btn:hover {
        border-color: var(--color-accent-bd);
      }
      .ws-pick-chev {
        font-size: 9px;
        color: var(--color-text-faint);
      }
      /* 气泡：用户一块浅底，助手直接铺在底上 */
      .u-turn {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        max-width: 42em;
      }
      .u-bub {
        flex: 1;
        min-width: 0;
        background: var(--color-surface-sunken);
        color: var(--color-text);
        border-radius: 12px;
        padding: 8px 12px;
        font-size: var(--content-font-size);
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .undo-chip {
        flex: none;
        margin-top: 6px;
        width: 22px;
        height: 22px;
        border: none;
        background: transparent;
        color: var(--color-text-faint);
        font-size: 13px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .u-turn:hover .undo-chip {
        opacity: 1;
      }
      .undo-chip:hover {
        color: var(--color-text);
      }
      .a-turn {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        max-width: 46em;
        position: relative;
      }
      .a-meta {
        font-size: 12px;
        color: var(--color-text-faint);
      }
      .a-ops {
        position: absolute;
        top: 0;
        right: 0;
        display: flex;
        gap: 2px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .a-turn:hover .a-ops {
        opacity: 1;
      }
      .a-ops button {
        width: 22px;
        height: 22px;
        border: none;
        background: transparent;
        color: var(--color-text-faint);
        font-size: 13px;
        cursor: pointer;
      }
      .a-ops button:hover {
        color: var(--color-text);
      }
      .a-msg {
        width: 100%;
        font-size: var(--content-font-size);
        line-height: 1.55;
      }
      .a-msg .md {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .a-msg pre {
        background: var(--color-surface);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        overflow-x: auto;
        font: 12.5px/1.6 var(--mono);
        margin: 8px 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .a-msg code {
        font: 12.5px var(--mono);
        background: var(--color-surface);
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--color-accent);
      }
      .a-msg pre code {
        background: none;
        padding: 0;
        color: var(--color-text);
      }
      /* 思考：默认一行，点开才见全文 */
      .think {
        max-width: 46em;
      }
      .think-sum {
        display: block;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        color: var(--color-text-faint);
        font-size: 13px;
        padding: 0;
        cursor: pointer;
      }
      .think-sum:hover {
        color: var(--color-text-muted);
      }
      .think .tk {
        display: none;
        margin: 6px 0 0;
        font: 12.5px/1.55 var(--mono);
        color: var(--color-text-muted);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .think.open .tk {
        display: block;
      }
      /* 工具：收成摘要，点开才是明细 */
      .work {
        max-width: 46em;
      }
      .work-sum {
        display: block;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        color: var(--color-text-faint);
        font: 13px/1.45 var(--mono);
        padding: 0;
        cursor: pointer;
      }
      .work-sum:hover {
        color: var(--color-text-muted);
      }
      .work-sum.edit {
        color: var(--color-success);
      }
      .work-list {
        display: none;
        margin-top: 6px;
      }
      .work.open .work-list,
      .work.live .work-list {
        display: block;
      }
      .tcall {
        margin: 0;
        background: transparent;
        border: none;
        overflow: hidden;
      }
      .tcall.err .a,
      .tcall.err .p {
        color: var(--color-danger);
      }
      .tcall .bh {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 24px;
        padding: 1px 0;
        cursor: pointer;
        font: 12.5px/1.4 var(--mono);
        color: var(--color-text-muted);
      }
      .tcall.open .bh,
      .tcall .bh:hover {
        color: var(--color-text);
      }
      .tcall.err .bh {
        color: var(--color-danger);
      }
      .tcall .gl {
        display: inline-flex;
        align-items: center;
        color: var(--color-text-faint);
        flex: none;
        font-size: 13px;
        width: 16px;
      }
      .tcall .a {
        color: var(--color-text);
        font-weight: var(--weight-medium);
        flex: none;
      }
      .tcall .p {
        color: var(--color-text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
        font-size: 12px;
      }
      .tcall .rt {
        margin-left: auto;
        color: var(--color-text-muted);
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
      }
      .tcall .tm {
        color: var(--color-text-faint);
        font-size: 11px;
      }
      .st-glyph {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        flex: none;
      }
      .st-glyph.run {
        border: 2px solid var(--color-accent-bd);
        border-top-color: var(--color-accent);
        animation: spin 0.8s linear infinite;
      }
      .st-glyph.ok {
        color: var(--color-success);
        border: 1px solid var(--color-success);
      }
      .st-glyph.err {
        color: var(--color-danger);
        border: 1px solid var(--color-danger);
      }
      .st-glyph.sus {
        background: var(--color-warning);
        border-radius: 2px;
        width: 8px;
        height: 8px;
      }
      .tcall .car {
        color: var(--color-text-faint);
        font-size: 10px;
        transition: transform 0.15s;
        flex: none;
      }
      .tcall.open .car {
        transform: rotate(90deg);
      }
      .tcall .bb {
        display: none;
      }
      .tcall.open .bb {
        display: block;
      }
      .tcall .bb-pad {
        padding: 0;
      }
      .tcall pre {
        margin: 0;
        padding: 10px 12px;
        overflow-x: auto;
        font: 12px/1.55 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .tcall pre.term {
        background: #010409;
        color: #c9d1d9;
      }
      .diff .ad {
        color: var(--color-text-faint);
      }
      .diff .ap {
        color: var(--color-success);
      }
      .diff .am {
        color: var(--color-danger);
      }
      .diff .ah {
        color: var(--color-accent);
      }
      /* 审批卡 */
      #dock {
        flex: none;
        width: 100%;
        max-width: var(--p-content-max);
        margin: 0 auto;
        padding: 0 20px;
      }
      #dock .pc {
        margin: 6px 0;
      }
      .pc {
        border: 1px solid var(--color-line-strong);
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--color-surface);
        font-size: 13px;
      }
      .pc .ah {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: var(--color-surface);
      }
      .pc .ah-ic {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--color-surface-sunken);
        color: var(--color-text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: var(--weight-bold);
        flex: none;
      }
      .pc .akind {
        font-weight: var(--weight-semibold);
        color: var(--color-text);
      }
      .pc .apath {
        color: var(--color-text-muted);
        font: 12px var(--mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pc .aw {
        flex: 1;
        color: var(--color-warning);
        font-size: 12px;
        text-align: right;
      }
      .pc .body {
        padding: 0 14px;
      }
      .pc .shell-cmd {
        font: 13px/1.6 var(--mono);
        color: var(--color-text);
        padding: 8px 0;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .pc .shell-dollar {
        color: var(--color-accent);
        font-weight: var(--weight-medium);
        margin-right: 8px;
      }
      .pc .shell-cwd {
        font: 12px var(--mono);
        color: var(--color-text-muted);
        margin: 2px 0 8px;
      }
      .pc .diff {
        max-height: 220px;
        overflow: auto;
        font: 12px/1.5 var(--mono);
        border-top: 1px solid var(--color-line);
        border-bottom: 1px solid var(--color-line);
      }
      .pc .dl {
        display: flex;
        padding: 0 12px;
      }
      .pc .dl.add {
        background: var(--color-success-soft);
      }
      .pc .dl.del {
        background: var(--color-danger-soft);
      }
      .pc .dg {
        width: 30px;
        color: var(--color-text-muted);
        text-align: right;
        padding-right: 8px;
        user-select: none;
        flex: none;
      }
      .pc .dc {
        white-space: pre;
      }
      .pc .file-line {
        display: flex;
        padding: 0 12px;
        font: 12px/1.5 var(--mono);
      }
      .pc .file-ln {
        width: 30px;
        color: var(--color-text-muted);
        text-align: right;
        padding-right: 8px;
        user-select: none;
        flex: none;
      }
      .pc .file-text {
        white-space: pre;
      }
      .pc .pb {
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid var(--color-line);
      }
      .pc button {
        flex: 1;
        height: 32px;
        border-radius: var(--radius-md);
        font-weight: var(--weight-medium);
        font-size: 13px;
        color: var(--color-text-on-accent);
      }
      .pc .ok {
        background: var(--color-accent);
      }
      .pc .ok:hover {
        background: var(--color-accent-hover);
      }
      .pc .no {
        background: var(--color-surface-sunken);
        color: var(--color-text);
        border: 1px solid var(--color-line);
      }
      .pc .no:hover {
        color: var(--color-danger);
        border-color: var(--color-danger);
      }
      .pc .alw {
        background: var(--color-surface-sunken);
        color: var(--color-text);
        border: 1px solid var(--color-line);
      }
      .pc .alw:hover {
        border-color: var(--color-text-muted);
      }
      .sys-line {
        font: 12px/1.5 var(--mono);
        color: var(--color-text-faint);
        padding: 4px 2px 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .turn-meta {
        font-size: 11px;
        color: var(--color-text-faint);
        letter-spacing: 0.01em;
      }
      #qbox {
        max-width: var(--p-content-max);
        margin: 0 auto 8px;
        border: 1px solid var(--color-line);
        border-radius: 16px;
        background: var(--color-surface);
        overflow: hidden;
      }
      #qbox[hidden] {
        display: none;
      }
      .q-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px 0;
        font-size: 12px;
        color: var(--color-text-muted);
      }
      .q-head b {
        font-weight: var(--weight-semibold);
        color: var(--color-text);
      }
      .q-head .q-to {
        color: var(--color-text-faint);
      }
      .q-head button {
        margin-left: auto;
        height: 22px;
        padding: 0 8px;
        border: none;
        background: transparent;
        color: var(--color-text-faint);
        font-size: 12px;
      }
      .q-head button:hover {
        color: var(--color-text);
      }
      .q-item {
        padding: 8px 12px 10px;
        font-size: 14px;
        line-height: 1.45;
        color: var(--color-text);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .q-item + .q-item {
        border-top: 1px solid var(--color-line);
        padding-top: 10px;
      }
      /* ==== composer ==== */
      #cmp {
        flex: none;
        padding: 8px 20px max(12px, env(safe-area-inset-bottom));
        position: relative;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--bg) 0%, transparent) 0,
          var(--bg) 28px
        );
      }
      #app.hero .chat-header {
        border-bottom-color: transparent;
      }
      #app.hero #panes {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app.hero #wrap {
        min-height: 0;
        padding: 0 20px;
      }
      #app.hero #cmp {
        padding-bottom: 12vh;
        background: none;
      }
      #app.hero #dock,
      #app.hero #qbox {
        display: none;
      }
      #app.hero .empty-keys,
      #app.hero .empty-hint-text {
        display: none;
      }
      #cmp > * {
        position: relative;
        z-index: 1;
      }
      .cmp-row {
        max-width: var(--p-content-max);
        margin: 0 auto;
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .composer-card {
        flex: 1;
        position: relative;
        border: 1px solid var(--color-line);
        border-radius: 22px;
        background: var(--color-surface-raised);
        box-shadow: var(--shadow-lg);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        min-width: 0;
      }
      .composer-card:focus-within {
        border-color: var(--color-line-strong);
        box-shadow: var(--shadow-lg);
      }
      .cin-wrap {
        position: relative;
        padding: 12px 16px 4px;
      }
      #inp {
        color: var(--color-text);
        flex: 1;
        border: none;
        outline: none;
        resize: none;
        font-size: 16px;
        background: transparent;
        min-height: 48px;
        max-height: calc(100vh / 4);
        overflow-y: auto;
        line-height: 1.5;
        width: 100%;
        display: block;
      }
      #inp::placeholder {
        color: var(--color-text-faint);
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px 12px;
      }
      .toolbar-left,
      .toolbar-right {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .perm-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        color: var(--color-text);
        cursor: pointer;
        user-select: none;
      }
      .perm-pill:hover {
        background: var(--color-surface-sunken);
      }
      .perm-allow {
        color: var(--color-success);
      }
      .perm-deny {
        color: var(--color-danger);
      }
      .perm-ask {
        color: var(--color-warning);
      }
      .mode-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        color: var(--color-text-muted);
        cursor: pointer;
        user-select: none;
      }
      .mode-pill:hover {
        background: var(--color-surface-sunken);
      }
      .mode-pill.on {
        color: var(--color-accent);
      }
      .mode-tag {

        height: 32px;

        padding: 0;

        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex: none;
        font-size: 13px;

      #send:hover {
        filter: brightness(1.12);

      #send:active {
        transform: scale(0.92);

        font-family: var(--mono);
        font-size: 13px;
        padding: 2px 8px;
        cursor: pointer;

      .compact-chip:hover {
        background: var(--color-warning-soft);

      /* ==== 菜单 ==== */
      .menu {

        box-shadow: var(--shadow-lg);
        z-index: var(--z-dropdown);
        display: none;

      .menu.open {
        display: block;

      .mi {

        align-items: center;
        gap: 8px;
        padding: 7px 12px;

        font-size: 13px;
        color: var(--color-text);

      .mi:hover {
        background: var(--color-surface-sunken);
      }
      .mi.danger {
        color: var(--color-danger);
      }
      .mi .mk {
        margin-left: auto;
        color: var(--color-text-faint);
        font-size: 11px;
      }
      .menu .sep {
        border-top: 1px solid var(--color-line);
        margin: 4px 6px;
      }
      .mi.check::before {
        content: "✓";
        color: var(--color-accent);
        flex: none;
        font-size: 11px;
      }
      /* ==== toast ==== */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 60px;
        transform: translateX(-50%);
        background: var(--color-surface-raised);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        padding: 8px 16px;
        font-size: 13px;
        color: var(--color-text);
        box-shadow: var(--shadow-lg);
        z-index: var(--z-toast);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;

      #toast.show {
        opacity: 1;

      /* ==== 移动端 ==== */
      .topbar {
        display: none;
        align-items: center;
        gap: 8px;
        height: 48px;
        padding: 0 12px;
        border-bottom: 1px solid var(--color-line);
        flex: none;
      }
      .topbar .wsq {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: var(--radius-full);
        font-size: 12px;
        color: var(--color-accent);
        border: 1px solid var(--color-accent-bd);
        background: var(--color-accent-soft);
        cursor: pointer;
      }
      .tb-mid {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        color: var(--color-text);
        text-align: left;
      }
      .tb-ws {
        color: var(--color-text-muted);
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tb-sl {
        color: var(--color-text-faint);
        flex: none;
      }
      .tb-se {
        font-weight: var(--weight-semibold);
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #sheet {
        display: none;
        position: fixed;
        inset: 0;
        z-index: var(--z-modal);
      }
      #sheet.open {
        display: block;
      }
      #scrim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
      }
      #spnl {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 86vh;
        background: var(--color-surface-raised);
        border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
        display: flex;
        flex-direction: column;
        transform: translateY(102%);
        transition: transform 0.28s ease-out;
        box-shadow: var(--shadow-lg);
      }
      #sheet.open #spnl {
        transform: translateY(0);
      }
      .grab {
        width: 38px;
        height: 5px;
        border-radius: 3px;
        background: var(--color-line-strong);
        margin: 8px auto 0;
        flex: none;
      }
      .shd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px 6px;
        flex: none;
      }
      .shd span {
        font-weight: var(--weight-semibold);
        font-size: 14px;
      }
      .shd button {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        color: var(--color-text-muted);
        font-size: 14px;
      }
      .shd button:hover {
        background: var(--color-surface-sunken);
        color: var(--color-text);
      }
      #sbody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 12px max(16px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      #sbody .se {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        border-radius: var(--radius-md);
      }
      #sbody .se .st {
        flex: 1;
      }
      #sbody .sg-sep {
        border-top: 1px solid var(--color-line);
        margin: 6px 8px;
      }
      /* 插件槽 */
      #plugin-header,
      #plugin-status {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #plugin-header:empty,
      #plugin-status:empty {
        display: none;
      }
      .piz-plugin-btn {
        height: 28px;
        min-width: 28px;
        padding: 0 9px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        color: var(--color-text-muted);
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .piz-plugin-btn:hover {
        color: var(--color-accent);
        border-color: var(--color-accent-bd);
      }
      @media (max-width: 840px) {
        .app {
          grid-template-columns: minmax(0, 1fr);
          height: 100dvh;
        }
        #side {
          display: none;
        }
        .topbar {
          display: flex;
        }
        #cmp {
          padding: 6px 10px max(10px, env(safe-area-inset-bottom));
        }
        #wrap {
          padding: 14px 12px 24px;
          max-width: none;
        }
        .u-bub {
          max-width: 88%;
        }
        #inp {
          font-size: 16px;
        }
        .chat-header {
          display: none;
        }
        #dock {
          padding: 0 10px;
        }
        .ch-ses {
          max-width: 40vw;
        }
      }
      @media (max-width: 640px) {
        #thread {
          gap: 16px;
        }
        #inp {
          max-height: 38vh;
        }
        #send {
          width: 36px;
          height: 36px;
        }
        .a-msg {
          font-size: 15px;
        }
      }
      html[data-accent="blue"] {
        --accent-primary: #6b7c99;

        --color-accent-soft: #eef0f4;
        --color-accent-bd: #c5ccd8;
        --blue: #6b7c99;
        --blue2: #8a99b3;
        --soft: #eef0f4;
        --bd: #c5ccd8;
      }
      html[data-color-scheme="dark"][data-accent="blue"] {

        --color-accent-hover: #a8b4c8;
        --color-accent-soft: #1c1e22;
        --color-accent-bd: #3a4250;

        display: flex;

        justify-content: space-between;

        padding: 12px 14px;

        font-size: 14px;
      }
      .dlg-x {
        border: 0;
        background: transparent;
        color: var(--color-text-muted);

        height: 28px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 14px;
      }
      .dlg-x:hover {
        background: var(--hover);

      .dlg-bd {

        font: inherit;
        font-size: 13px;

      }
      .dlg-in:focus {
        border-color: var(--color-accent);
        box-shadow: 0 0 0 3px var(--color-accent-soft);
      }
      .dlg-msg {

      .btn {
        border: 1px solid var(--color-line);
        background: var(--color-surface);

      .btn:hover {
        background: var(--hover);

      .btn-p {
        background: var(--color-accent);
        border-color: var(--color-accent);
        color: var(--color-text-on-accent);
      }
      .btn-p:hover {

        gap: 4px;

        background: transparent;

        border-radius: var(--radius-sm);
        cursor: pointer;
        font: inherit;

        flex-direction: column;
        gap: 2px;

        color: var(--color-text-faint);
        font-size: 12px;
      }

        display: inline-flex;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        overflow: hidden;
        flex: none;

      .seg button {
        border: 0;
        background: transparent;
        color: var(--color-text-muted);
        padding: 5px 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .seg button.on {
        background: var(--color-accent);
        color: var(--color-text-on-accent);
      }
      .num-in {
        width: 64px;
        border: 1px solid var(--color-line);
        background: var(--color-surface-sunken);
        color: var(--color-text);
        border-radius: var(--radius-sm);
        padding: 4px 6px;
        font: inherit;
        font-size: 13px;
      }
      .sw {
        width: 36px;
        height: 20px;
        border: 0;
        border-radius: 99px;
        background: var(--color-line-strong);
        position: relative;
        cursor: pointer;
        flex: none;
      }
      .sw.on {
        background: var(--color-accent);
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .sw.on::after {
        transform: translateX(16px);
      }
      .hit {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        cursor: pointer;

      .hit.on {
        background: var(--color-surface-sunken);

      .hit-t {
        font-size: 13px;
        font-weight: 600;
      }
      .hit-s {
        font-size: 12px;
        color: var(--color-text-muted);
      }
      .slash-menu {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        right: 0;
        padding: 6px;
        background: var(--color-surface-raised);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg);
        z-index: var(--z-dropdown);
        max-height: 280px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .slash-list {
        overflow-y: auto;
        min-height: 0;
      }
      .slash-item {
        display: grid;
        grid-template-columns: minmax(96px, 30%) minmax(0, 1fr);
        gap: 10px;
        padding: 8px 10px;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: 13px;
      }
      .slash-item:hover,
      .slash-item.active {
        background: var(--color-surface-sunken);
      }
      .slash-name {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--color-text);
      }
      .slash-desc {
        color: var(--color-text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .slash-foot {
        display: flex;
        gap: 10px;
        padding: 6px 10px 2px;
        color: var(--color-text-faint);
        font-size: 11px;
      }
      .ctx-wrap {
        display: inline-flex;
        align-items: center;
        gap: 6px;

      .ctx-ring {
        width: 16px;
        height: 16px;
        flex: none;
        transform: rotate(-90deg);

      .ctx-ring-track {
        stroke: var(--color-line);

        stroke: var(--color-text-muted);

        align-items: center;

        border: 1px solid var(--color-line);

        background: var(--color-surface-sunken);
        font: inherit;
        font-size: 11px;
        font-family: var(--mono);
        line-height: 1.6;
      }

            ><span class="ch-ses" id="hSes" title="重命名"></span>

              <button type="button" id="qClr">清空</button>

            <div class="composer-card">
              <div id="slashMenu" class="slash-menu" hidden></div>
              <div class="cin-wrap">
                <textarea
                  id="inp"
                  rows="1"
                  placeholder="消息 · / 命令 · @./文件 · !命令 · Enter 发送"
                  data-ph="消息 · / 命令 · @./文件 · !命令 · Enter 发送"
                ></textarea>
              </div>
              <div class="toolbar">
                <div class="toolbar-left">
                  <span
                    class="perm-pill perm-allow"
                    id="permPill"

                  >
                  <span class="mode-pill" id="modePill" title="斜杠命令"
                    >/ 命令<span
                      class="mode-tag"
                      id="modeTag"
                      style="display: none"
                    ></span
                  ></span>
                  <span class="mode-pill" id="hModel" title="切换模型">…</span>
                  <span class="mode-pill" id="hThink" title="思考等级">◇ high</span>
                  <span id="turnMeta" class="turn-meta" hidden></span>
                  <button
                    class="compact-chip"
                    id="compactChip"
                    style="display: none"
                  >
                    ⚡ 上下文已满
                  </button>
                </div>
                <div class="toolbar-right">
                  <span id="ctxWrap" class="ctx-wrap" title="上下文占用" hidden
                    ><svg class="ctx-ring" viewBox="0 0 20 20" aria-hidden="true">
                      <circle class="ctx-ring-track" cx="10" cy="10" r="7" fill="none" stroke-width="2.5"></circle>
                      <circle id="ctxFill" class="ctx-ring-fill" cx="10" cy="10" r="7" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="43.98" stroke-dashoffset="43.98"></circle></svg
                    ><span id="ctxLbl"></span></span
                  ><span id="plugin-composer" data-piz-slot="composer"></span

      </main>
    </div>
    <div class="menu" id="kmenu"></div>
    <div class="menu" id="wsmenu"></div>
    <div class="menu" id="modelMenu"></div>
    <div class="menu" id="thinkMenu"></div>
    <div class="menu" id="permMenu"></div>
    <div id="toast"></div>
    <div id="overlay"></div>
    <div id="sheet">
      <div id="scrim"></div>
      <div id="spnl">
        <div class="grab"></div>
        <div class="shd">
          <span id="stl">会话</span><button id="scls">✕</button>
        </div>
        <div id="sbody"></div>
      </div>
    </div>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      const qp = new URLSearchParams(location.search);
      const sess = qp.get("session") || "default";
      const ws = decodeURIComponent(qp.get("ws") || "");
      const wsp = ws ? "ws=" + encodeURIComponent(ws) + "&" : "";
      const isMobile = () => window.innerWidth < 840;
      const PREF_KEY = "piz.prefs";
      const prefs = {
        scheme: "dark",
        accent: "mono",
        accentPicked: false,
        uiFont: 14,
        notify: false,
        sound: false,
      };
      try {
        Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || "{}"));
      } catch {}
      if (!prefs.accentPicked) prefs.accent = "mono";
      try {
        const old = localStorage.getItem("piz.scheme");
        if (old && !localStorage.getItem(PREF_KEY)) prefs.scheme = old;
      } catch {}
      function savePrefs() {
        try {
          localStorage.setItem(PREF_KEY, JSON.stringify(prefs));
        } catch {}
      }
      function applyScheme() {
        const root = document.documentElement;
        root.dataset.colorScheme = prefs.scheme || "dark";
        root.dataset.accent = prefs.accent || "mono";
        const fs = (prefs.uiFont || 14) + "px";
        root.style.setProperty("--ui-font-size", fs);
        root.style.setProperty("--text-base", fs);
        const dark =
          prefs.scheme === "dark" ||
          (prefs.scheme === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        const tm = document.querySelector('meta[name="theme-color"]');
        if (tm) tm.setAttribute("content", dark ? "#151517" : "#ffffff");
      }
      applyScheme();
      if (window.matchMedia) {
        try {
          matchMedia("(prefers-color-scheme: dark)").addEventListener(
            "change",
            applyScheme,
          );
        } catch {}
      }
      try {
        if (localStorage.getItem("piz.sidebar") === "1")
          document.body.classList.add("collapsed");
      } catch {}
      // ---- 服务器凭证(kimi serverAuth.ts:#token= fragment + sessionStorage) ----
      const AUTH_KEY = "piz-web.credential";
      let credential = undefined;
      function readFragmentToken() {
        const hash = location.hash || "";
        if (!hash.startsWith("#")) return undefined;
        const params = new URLSearchParams(hash.slice(1));
        const token = params.get("token");
        if (!token) return undefined;
        const url = new URL(location.href);
        url.hash = "";
        history.replaceState(history.state, "", url.pathname + url.search);
        return token;
      }
      function initServerAuth() {
        const frag = readFragmentToken();
        if (frag) { setCredential(frag); return true; }
        try {
          const stored = sessionStorage.getItem(AUTH_KEY);
          if (stored) { credential = stored; return true; }
        } catch {}
        return false;
      }
      function setCredential(v) {
        credential = v;
        try { sessionStorage.setItem(AUTH_KEY, v); } catch {}
      }
      function clearCredential() {
        credential = undefined;
        try { sessionStorage.removeItem(AUTH_KEY); } catch {}
      }
      function showAuthPage(msg) {
        $("splash")?.classList.add("hide");
        $("authPage")?.classList.add("show");
        if (msg) $("authErr").textContent = msg;
        const inp = $("authTok");
        if (inp) { inp.disabled = false; inp.focus(); }
        const btn = $("authBtn");
        if (btn) btn.disabled = true;
      }
      function hideAuthPage() {
        $("authPage")?.classList.remove("show");
        $("authErr").textContent = "";
      }
      // fetch 全局包装:带 Bearer + 401 → 登录页(kimi http.ts 等价)
      const rawFetch = window.fetch.bind(window);
      window.fetch = (url, opts = {}) => {
        opts = Object.assign({}, opts);
        opts.headers = Object.assign({}, opts.headers || {});
        if (credential) opts.headers["Authorization"] = "Bearer " + credential;
        return rawFetch(url, opts).then((res) => {
          if (res.status === 401 && !opts.headers["X-Skip-Auth"]) {
            clearCredential();
            showAuthPage("凭证无效或已过期,请重新输入");
          }
          return res;
        });
      };
      // 登录提交
      const authInp = $("authTok");
      authInp.addEventListener("input", () => {
        $("authBtn").disabled = !authInp.value.trim();
      });
      authInp.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && authInp.value.trim() && !$("authBtn").disabled)
          submitAuth();
      });
      async function submitAuth() {
        const v = authInp.value.trim();
        if (!v) return;
        $("authBtn").disabled = true;
        authInp.disabled = true;
        setCredential(v);
        try {
          const r = await rawFetch("/api/state?" + wsp + "session=" + encodeURIComponent(sess), {
            headers: { Authorization: "Bearer " + v, "X-Skip-Auth": "1" },
          });
          if (r.ok) {
            hideAuthPage();
            boot();
          } else {
            clearCredential();
            $("authErr").textContent = "连接失败,请检查 token";
            authInp.disabled = false;
            authInp.focus();
            $("authBtn").disabled = false;
          }
        } catch (e) {
          clearCredential();
          $("authErr").textContent = "无法连接服务器";
          authInp.disabled = false;
          $("authBtn").disabled = false;
        }
      }
      $("authBtn").onclick = submitAuth;
      // ---- toast ----
      const toastEl = $("toast");
      let toastT = null;
      function showToast(t) {
        toastEl.textContent = t;
        toastEl.classList.add("show");
        clearTimeout(toastT);
        toastT = setTimeout(() => toastEl.classList.remove("show"), 2200);
      }
      let dlgOnok = null,
        dlgOncancel = null;
      function closeDlg() {
        const ov = $("overlay");
        ov.classList.remove("open");
        ov.innerHTML = "";
        dlgOnok = dlgOncancel = null;
      }
      function openDlg(opts) {
        const ov = $("overlay");
        ov.classList.add("open");
        ov.innerHTML =
          '<div class="dlg ' +
          (opts.cls || "") +
          '" role="dialog"><div class="dlg-hd"><span>' +
          esc(opts.title || "") +
          '</span><button class="dlg-x" id="dlgX" type="button">✕</button></div><div class="dlg-bd">' +
          (opts.body || "") +
          "</div>" +
          (opts.ok
            ? '<div class="dlg-ft">' +
              (opts.cancel
                ? '<button class="btn" id="dlgCancel" type="button">' +
                  esc(opts.cancel) +
                  "</button>"
                : "") +
              '<button class="btn ' +
              (opts.danger ? "btn-d" : "btn-p") +
              '" id="dlgOk" type="button">' +
              esc(opts.ok) +
              "</button></div>"
            : "") +
          "</div>";
        dlgOnok = opts.onok || null;
        dlgOncancel = opts.oncancel || null;
        $("dlgX").onclick = () => {
          if (dlgOncancel) dlgOncancel();
          closeDlg();
        };
        const cxl = $("dlgCancel");
        if (cxl)
          cxl.onclick = () => {
            if (dlgOncancel) dlgOncancel();
            closeDlg();
          };
        const ok = $("dlgOk");
        if (ok)
          ok.onclick = () => {
            const r = dlgOnok && dlgOnok();
            if (r !== false) closeDlg();
          };
        ov.onclick = (e) => {
          if (e.target === ov) {
            if (dlgOncancel) dlgOncancel();
            closeDlg();
          }
        };
        if (opts.focus && $(opts.focus)) {
          const el = $(opts.focus);
          el.focus();
          if (el.select) el.select();
        }
      }
      function askText(title, value, placeholder) {
        return new Promise((resolve) => {
          openDlg({
            title,
            body:
              '<input id="dlgIn" class="dlg-in" value="' +
              esc(value || "") +
              '" placeholder="' +
              esc(placeholder || "") +
              '">',
            ok: "确定",
            cancel: "取消",
            focus: "dlgIn",
            onok: () => {
              resolve($("dlgIn").value);
            },
            oncancel: () => resolve(null),
          });
          $("dlgIn").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              resolve($("dlgIn").value);
              closeDlg();
            }
          });
        });
      }
      function askYes(title, msg) {
        return new Promise((resolve) => {
          openDlg({
            title,
            body: '<p class="dlg-msg">' + esc(msg) + "</p>",
            ok: "确定",
            danger: true,
            cancel: "取消",
            onok: () => resolve(true),
            oncancel: () => resolve(false),
          });
        });
      }
      function segHtml(name, opts, cur) {
        return (
          '<div class="seg" data-seg="' +
          name +
          '">' +
          opts
            .map(
              (o) =>
                '<button type="button" data-v="' +
                esc(o.v) +
                '" class="' +
                (o.v === cur ? "on" : "") +
                '">' +
                esc(o.l) +
                "</button>",
            )
            .join("") +
          "</div>"
        );
      }
      function bindSeg(name, fn) {
        const box = document.querySelector('[data-seg="' + name + '"]');
        if (!box) return;
        box.onclick = (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          for (const x of box.querySelectorAll("button")) x.classList.remove("on");
          b.classList.add("on");
          fn(b.getAttribute("data-v"));
        };
      }
      function openSettings() {
        openDlg({
          cls: "set",
          title: "设置",
          body:
            '<div class="set-tabs" id="setTabs"><button type="button" data-tab="look" class="on">外观</button><button type="button" data-tab="note">通知</button><button type="button" data-tab="about">关于</button></div>' +
            '<div id="setLook">' +
            '<div class="set-row"><div class="set-lab">配色</div>' +
            segHtml("scheme", [{ v: "light", l: "浅色" }, { v: "dark", l: "深色" }, { v: "system", l: "系统" }], prefs.scheme) +
            "</div>" +
            '<div class="set-row"><div class="set-lab">强调色</div>' +
            segHtml("accent", [{ v: "mono", l: "墨" }, { v: "blue", l: "蓝" }], prefs.accent) +
            "</div>" +
            '<div class="set-row"><div class="set-lab">界面字号</div><input id="setFont" class="num-in" type="number" min="12" max="20" value="' +
            (prefs.uiFont || 14) +
            '"></div></div>' +
            '<div id="setNote" hidden>' +
            '<div class="set-row"><div class="set-lab">完成时通知<span class="set-hint">浏览器系统通知</span></div><button type="button" class="sw' +
            (prefs.notify ? " on" : "") +
            '" id="swNotify"></button></div>' +
            '<div class="set-row"><div class="set-lab">完成时提示音</div><button type="button" class="sw' +
            (prefs.sound ? " on" : "") +
            '" id="swSound"></button></div></div>' +
            '<div id="setAbout" hidden>' +
            '<div class="set-row"><div class="set-lab">piz web<span class="set-hint">配置见 ~/.piz/</span></div></div>' +
            '<div class="set-row"><div class="set-lab">快捷键<span class="set-hint"><kbd>Ctrl</kbd><kbd>K</kbd> 搜会话 · <kbd>Ctrl</kbd><kbd>,</kbd> 设置 · <kbd>/</kbd> 命令</span></div></div></div>',
        });
        const tabs = $("setTabs");
        const panels = { look: $("setLook"), note: $("setNote"), about: $("setAbout") };
        tabs.onclick = (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          for (const x of tabs.querySelectorAll("button")) x.classList.toggle("on", x === b);
          for (const k of Object.keys(panels)) panels[k].hidden = k !== b.dataset.tab;
        };
        bindSeg("scheme", (v) => {
          prefs.scheme = v;
          savePrefs();
          applyScheme();
        });
        bindSeg("accent", (v) => {
          prefs.accent = v;
          prefs.accentPicked = true;
          savePrefs();
          applyScheme();
        });
        $("setFont").onchange = () => {
          prefs.uiFont = Math.min(20, Math.max(12, +$("setFont").value || 14));
          savePrefs();
          applyScheme();
        };
        $("swNotify").onclick = async () => {
          if (!prefs.notify && window.Notification && Notification.permission === "default") {
            try {
              await Notification.requestPermission();
            } catch {}
          }
          prefs.notify = !prefs.notify;
          $("swNotify").classList.toggle("on", prefs.notify);
          savePrefs();
        };
        $("swSound").onclick = () => {
          prefs.sound = !prefs.sound;
          $("swSound").classList.toggle("on", prefs.sound);
          savePrefs();
        };
      }
      function openSearch() {
        const hits = sessList.slice();
        let sel = 0;
        openDlg({
          title: "搜索会话",
          body:
            '<input id="dlgIn" class="dlg-in" placeholder="按标题或名字过滤…">' +
            '<div id="hitList" style="margin-top:8px;max-height:50vh;overflow:auto"></div>',
          focus: "dlgIn",
        });
        const box = $("hitList");
        const inp = $("dlgIn");
        function paint() {
          const q = (inp.value || "").toLowerCase().trim();
          const shown = [];
          for (const s of hits) {
            const title = s.title || s.name || "";
            const name = s.name || "";
            if (q && !title.toLowerCase().includes(q) && !name.toLowerCase().includes(q))
              continue;
            shown.push(s);
            if (shown.length >= 80) break;
          }
          if (sel >= shown.length) sel = Math.max(0, shown.length - 1);
          box.innerHTML = shown.length
            ? shown
                .map(
                  (s, i) =>
                    '<div class="hit' +
                    (i === sel ? " on" : "") +
                    '" data-name="' +
                    esc(s.name) +
                    '"><div class="hit-t">' +
                    esc(s.title || s.name) +
                    '</div><div class="hit-s">' +
                    esc(s.name) +
                    (s.msgs ? " · " + s.msgs + " 条" : "") +
                    "</div></div>",
                )
                .join("")
            : '<div class="dlg-msg">无匹配会话</div>';
          const on = box.querySelector(".hit.on");
          if (on) on.scrollIntoView({ block: "nearest" });
          return shown;
        }
        function go(name) {
          if (!name) return;
          closeDlg();
          location.href =
            "/?session=" +
            encodeURIComponent(name) +
            (ws ? "&ws=" + encodeURIComponent(ws) : "");
        }
        inp.addEventListener("input", () => {
          sel = 0;
          paint();
        });
        inp.addEventListener("keydown", (e) => {
          const shown = paint();
          if (e.key === "ArrowDown") {
            e.preventDefault();
            sel = Math.min(shown.length - 1, sel + 1);
            paint();
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            sel = Math.max(0, sel - 1);
            paint();
          } else if (e.key === "Enter") {
            e.preventDefault();
            if (shown[sel]) go(shown[sel].name);
          }
        });
        box.onclick = (e) => {
          const h = e.target.closest(".hit");
          if (h) go(h.getAttribute("data-name"));
        };
        paint();
      }
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openSearch();
          return;
        }
        if ((e.metaKey || e.ctrlKey) && e.key === ",") {
          e.preventDefault();
          openSettings();
          return;
        }
        if (e.key === "Escape") {
          if ($("overlay").classList.contains("open")) {
            e.preventDefault();
            if (dlgOncancel) dlgOncancel();
            closeDlg();
            return;
          }
          const sm = $("slashMenu");
          if (sm && !sm.hidden) {
            sm.hidden = true;
          }
        }
      });
      // ---- 菜单助手 ----
      let openMenu = null;
      function closeMenus() {
        for (const m of document.querySelectorAll(".menu.open"))
          m.classList.remove("open");
        openMenu = null;
      }
      function openAt(id, btn) {
        closeMenus();
        const m = $(id);
        m.classList.add("open");
        const r = btn.getBoundingClientRect();
        const mw = m.offsetWidth,
          mh = m.offsetHeight;
        m.style.left = Math.min(r.right - mw, innerWidth - mw - 8) + "px";
        m.style.top = Math.min(r.bottom + 4, innerHeight - mh - 8) + "px";
        openMenu = m;
      }
      document.addEventListener("click", (e) => {
        if (
          !e.target.closest(".menu") &&
          !e.target.closest(".ib") &&
          !e.target.closest(".perm-pill") &&
          !e.target.closest(".mode-pill") &&
          !e.target.closest(".ch-brand") &&
          !e.target.closest(".ws-chip") &&
          !e.target.closest(".ch-ws")
        )
          closeMenus();
      });
      // ---- 项目 ----
      function loadWorkspaces() {
        return fetch("/api/workspaces")
          .then((r) => r.json())
          .catch(() => []);
      }
      function projectName(root) {
        if (!root) return "";
        const parts = String(root).replace(/\/+$/, "").split("/");
        return parts[parts.length - 1] || root;
      }
      async function renderWsName() {
        const list = await loadWorkspaces();
        const cur = ws || (list[0] ? list[0].root : "");
        const nm = projectName(cur) || "piz";
        $("wsName").textContent = "piz";
        $("tbWs").textContent = nm;
        if ($("heroWsLbl")) $("heroWsLbl").textContent = nm || "选择项目";
        if ($("hWs") && !$("hWs").textContent) {
          $("hWs").textContent = nm;
          if ($("hSep")) $("hSep").style.display = nm ? "" : "none";
        }
        return list;
      }
      async function addProject() {
        const root = await askText("添加项目", "", "绝对路径，如 /home/me/proj");
        if (!root) return;
        fetch("/api/workspaces", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ root }),
        })
          .then((r) => r.json())
          .then(() => {
            location.href = sessUrl("default", root);
          })
          .catch(() => showToast("无效目录"));
      }
      async function openWsMenu(btn) {
        const list = await renderWsName();
        const cur = ws || (list[0] ? list[0].root : "");
        const m = $("wsmenu");
        m.innerHTML = "";
        for (const w of list) {
          const d = document.createElement("div");
          d.className = "mi" + (w.root === cur ? " check" : "");
          d.textContent = (w.name || projectName(w.root)) + " · " + w.root;
          d.title = w.root;
          d.onclick = () => {
            if (w.root !== cur) location.href = sessUrl("default", w.root);
          };
          m.appendChild(d);
        }
        const sep = document.createElement("div");
        sep.className = "sep";
        m.appendChild(sep);
        const add = document.createElement("div");
        add.className = "mi";
        add.textContent = "＋ 添加项目…";
        add.onclick = () => {
          closeMenus();
          addProject();
        };
        m.appendChild(add);
        openAt("wsmenu", btn);
      }
      $("wsqBtn").onclick = (e) => {
        e.stopPropagation();
        openWsMenu(e.currentTarget);
      };
      // ---- 会话列表 ----
      let sessList = [],
        archList = [],
        sessMeta = {};

        let last = 0,
          m;

          if (m.index > last) out.push(mdInline(raw.slice(last, m.index)));
          out.push("<pre><code>" + esc(m[2]) + "</code></pre>");
          last = m.index + m[0].length;

          if (m.index > last) out.push(esc(t.slice(last, m.index)));
          out.push("<code>" + esc(m[1]) + "</code>");
          last = m.index + m[0].length;
        }
        if (last < t.length) out.push(esc(t.slice(last)));

          .join("")
          .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
          .replace(/\n/g, "<br>");

      async function connectSSE() {
        try {
          const res = await fetch("/api/events" + (wsp ? "?" + wsp : ""), {
            headers: { accept: "text/event-stream" },

          if (!res.ok || !res.body) {
            sseRetry = Math.min(sseRetry + 1, 8);
            setTimeout(connectSSE, 1000 * sseRetry);
            return;
          }
          sseRetry = 0;
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = "";
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            let idx;
            while ((idx = buf.indexOf("\n\n")) !== -1) {
              const chunk = buf.slice(0, idx);
              buf = buf.slice(idx + 2);
              for (const line of chunk.split("\n")) handleSSELine(line);
            }
